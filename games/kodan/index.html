<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f0e4">
<meta name="description" content="名前を入れれば、あなたが主役。講談口調で、短く威勢よく褒め倒します。">
<title>お見事！｜あなたを褒める講談</title>
<style>
:root{color-scheme:light;--paper:#f6f0e4;--ink:#292b27;--red:#aa352c;--muted:#77746a;--gold:#b38d47;--line:#d9cfbb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.7;background-image:radial-gradient(#a18a5c16 .7px,transparent .7px);background-size:6px 6px}button,input{font:inherit}button{cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:5px}[hidden]{display:none!important}.shell{width:min(1080px,calc(100% - 48px));margin:auto}header{height:90px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.14em}.brand{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:12px;font-weight:bold}.seal{display:inline-grid;place-items:center;border:1px solid var(--red);color:var(--red);width:35px;height:35px;font-size:18px;transform:rotate(-5deg)}.headnote{color:var(--muted)}.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center;min-height:650px;padding:60px 0}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--red);font-weight:bold}.hero h1{font-size:clamp(74px,9vw,115px);line-height:1.18;letter-spacing:-.07em;margin:20px 0 28px;font-weight:900}.hero h1 span{color:var(--red)}.lead{font-size:18px;line-height:2.1}.small{font-size:12px;color:var(--muted)}.accent{width:65px;height:4px;background:var(--red);margin:28px 0}.setup{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:32px 0 27px}.setup h2{font-size:25px;margin:8px 0 26px}.field{display:flex;align-items:center;border-bottom:1px solid var(--ink);gap:10px;margin:12px 0 8px}.field input{border:0;background:transparent;width:100%;min-width:0;padding:14px 6px;font-size:25px;color:var(--ink);border-radius:0}.field span{font-size:23px;white-space:nowrap;padding-right:8px}label{font-size:13px;font-weight:bold}.primary{width:100%;border:1px solid var(--red);background:var(--red);color:#fffaf0;padding:17px 20px;font-size:19px;font-weight:bold;letter-spacing:.12em;margin-top:25px;box-shadow:3px 3px 0 #d3bbaa}.primary:hover{background:#902b24}.primary:active{transform:translateY(2px);box-shadow:none}.privacy{font-size:11px;color:var(--muted);margin:20px 0 0;line-height:1.9}.gift-notice{padding:12px;border:1px solid var(--gold);background:#eee3ca;margin-bottom:20px;overflow-wrap:anywhere}.example{border-top:1px solid var(--line);padding:26px 0 34px;display:flex;justify-content:space-between;align-items:center;gap:25px}.example blockquote{font-size:19px;margin:0}.example .small{flex-shrink:0}footer{border-top:1px solid var(--line);padding:20px 0 30px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}footer a{color:inherit}.stage{min-height:calc(100svh - 160px);display:flex;flex-direction:column;align-items:center;padding:40px 0 20px;position:relative}.stage-top{width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:15px}.text-btn{border:0;background:transparent;color:var(--muted);padding:10px;font-size:13px;min-height:44px}.performance{width:min(760px,100%);text-align:center;padding:45px 25px 30px;position:relative;margin:auto 0;isolation:isolate}.performance:before{content:"";position:absolute;inset:36px 0 20px;border:1px solid var(--line);z-index:-1;pointer-events:none}.recipient{font-size:clamp(26px,5vw,43px);font-weight:bold;margin:10px 0 22px;overflow-wrap:anywhere}.quote{font-size:clamp(24px,3.6vw,39px);font-weight:bold;line-height:1.8;letter-spacing:.02em;margin:0 auto;max-width:650px;overflow-wrap:anywhere;min-height:3.6em}.stamp{display:inline-block;color:var(--red);border:3px double var(--red);padding:3px 15px;transform:rotate(-7deg);font-size:26px;font-weight:bold;margin-top:26px;letter-spacing:.12em}.new .stamp{animation:stamp .35s ease-out}.new .quote{animation:reveal .4s ease-out}.next{width:min(360px,100%);margin:20px 0 18px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}.control{border:1px solid var(--line);background:#fffaf066;color:var(--ink);min-height:44px;padding:9px 16px;font-size:13px}.control[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:#eee0cd}.share{border-color:var(--ink)}.stage-note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 22px;font-size:13px;width:max-content;max-width:calc(100% - 32px);z-index:10;box-shadow:0 4px 20px #0002}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes stamp{from{opacity:0;transform:rotate(-7deg) scale(1.7)}to{opacity:1;transform:rotate(-7deg) scale(1)}}@keyframes reveal{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}@media(max-width:720px){.shell{width:calc(100% - 36px)}header{height:65px}.headnote{font-size:10px;letter-spacing:0}.intro{grid-template-columns:1fr;gap:24px;min-height:0;padding:32px 0}.hero h1{font-size:72px;margin:10px 0 14px}.lead{font-size:15px;margin:0}.accent{display:none}.hero .small{display:none}.setup{padding:22px 0}.setup h2{font-size:22px;margin:5px 0 18px}.primary{margin-top:18px}.privacy{margin-top:16px}.example{display:block;padding:24px 0}.example blockquote{font-size:16px;margin-top:10px}footer{font-size:10px}.stage{min-height:calc(100svh - 135px);padding-top:15px}.performance{padding:30px 14px 25px}.recipient{margin:12px 0 18px}.quote{font-size:25px}.controls{gap:7px}.control{padding:9px 12px}.stage-note{max-width:300px}.stamp{font-size:23px;margin-top:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header><a class="brand" href="#" id="homeLink"><span class="seal" aria-hidden="true">誉</span>あなたを褒める講談</a><span class="headnote">本日の主役は、あなた。</span></header>
<main id="setupPage">
<div class="intro">
<section class="hero"><div class="eyebrow">さあさあ、一席。</div><h1>お<span>見事</span>！</h1><p class="lead">何気ない毎日に、威勢のいい一言。<br>名前を入れれば、あなたが主役。</p><div class="accent"></div><p class="small">自分にも、大切なあの人にも。</p></section>
<section class="setup" aria-labelledby="setupTitle">
<div id="giftNotice" class="gift-notice" hidden></div>
<div class="eyebrow">一席、進呈いたします。</div><h2 id="setupTitle">どなたを褒めましょう？</h2>
<form id="setupForm">
<label for="personName">お名前・ニックネーム</label>
<div class="field"><input id="personName" autocomplete="nickname" maxlength="20" placeholder="例：旭堂南不二" required aria-describedby="nameHint" enterkeyhint="go"><span>殿</span></div>
<div id="nameHint" class="small">自分の名前でも、誰かの名前でも。</div>
<button class="primary" type="submit">いざ、開演！ <span aria-hidden="true">→</span></button>
<p class="privacy">入力した名前は、この画面でのみ使用します。<br>「この一席を贈る」で作るリンクには、名前と褒め言葉の番号が入ります。</p>
</form></section>
</div>
<div class="example"><span class="small">たとえば、こんな一席。</span><blockquote>「太郎殿！ その気配り、天下一品。お見事！」</blockquote></div>
</main>
<main id="stage" class="stage" hidden>
<div class="stage-top"><button class="text-btn" id="backButton" type="button">← お名前を変える</button><span id="count">第一席</span></div>
<section id="performance" class="performance" aria-label="あなたへの一席">
<h1 id="recipient" class="recipient" tabindex="-1"></h1>
<p id="quote" class="quote"></p>
<div id="stamp" class="stamp" aria-hidden="true">お見事</div>
</section>
<button id="nextButton" class="primary next" type="button">もう一席！ <span aria-hidden="true">→</span></button>
<div class="controls" aria-label="楽しみ方">
<button id="autoButton" class="control" type="button" aria-pressed="false">自動：オフ</button>
<button id="soundButton" class="control" type="button" aria-pressed="false">張り扇の音：オフ</button>
<button id="shareButton" class="control share" type="button">この一席を贈る ↗</button>
</div>
<p class="stage-note">気に入った一席は、そのまま誰かに贈れます。</p>
<div id="liveMessage" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main>
<footer><span>小さな頑張りに、大きな拍手。</span><a href="https://kyokudominamifuji.com/">ホームページへ ↗</a></footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
<script>
(() => {
'use strict';
// Adapted from the arigato game's nickname, repeated praise and fragment gift-link flow.
const phrases = [
['その気配り、天下一品。お見事！','お見事'],
['今日も一日、よくぞ励んだ。その働きに、大きな拍手！','大喝采'],
['人にやさしくできるとは、心の器が大きいお方！','天晴'],
['派手さはなくとも、こつこつ進む。その一歩こそ、お見事！','お見事'],
['その笑顔ひとつで、場が明るくなる。まさに福の神！','福の神'],
['よくぞここまで参られた。今日は堂々、胸を張れ！','天晴'],
['うまくいかぬ日も投げ出さぬ。その粘り腰に、拍手喝采！','大喝采'],
['ひと息つくのも立派な采配。休む決断、お見事！','名采配'],
['そのひと言に救われる人もいる。言葉のぬくもり、天下一品！','天下一品'],
['目立たぬところで積む手間ひま。それこそ見上げた心意気！','天晴'],
['よく食べ、よく休む。それも明日への大仕事！','お見事'],
['失敗しても、また一歩。その心意気に、異議なし！','天晴'],
['人の話に耳を傾ける。その懐の深さ、お見事！','お見事'],
['小さな約束を大切にする。これぞ信頼を築くお方！','大喝采'],
['今日の主役は、ほかでもない。あなたでございます！','本日の主役'],
['その工夫ひとつが道を開く。知恵の冴えに、拍手喝采！','大喝采'],
['頑張りすぎずに歩むもよし。自分の歩幅を知る名人！','名人'],
['昨日と比べて、ほんの一歩。それでも前進、お見事！','お見事'],
['褒められに来るとは、よい心がけ。自分を大切にする達人！','達人'],
['まだまだ褒めどころが尽きませぬ。張り扇のほうが先に参った！','大喝采'],
['その律儀さ、折り紙つき。安心して任せられるお方！','天下一品'],
['人の喜びをともに喜ぶ。その心根こそ、宝でございます！','天晴'],
['ここで一席、受け取る余裕。その心のゆとり、お見事！','お見事'],
['本日の頑張り、しかと承った。ここに大きな拍手を送る！','大喝采']
];
const $ = id => document.getElementById(id);
const ui = Object.fromEntries(['setupPage','setupForm','personName','stage','recipient','quote','stamp','count','performance','nextButton','backButton','homeLink','autoButton','soundButton','shareButton','liveMessage','toast','giftNotice'].map(id => [id,$(id)]));
const clean = value => Array.from((value || '').trim().replace(/\s+/g,' ')).slice(0,20).join('');
const addressed = name => /殿$/.test(name) ? name : name + '殿';
let name = '', index = -1, count = 0, active = false, auto = false, sound = false;
let timer = null, toastTimer = null, audio = null, deck = [], giftIndex = null;
function toast(text) {
  clearTimeout(toastTimer); ui.toast.textContent = text; ui.toast.hidden = false;
  toastTimer = setTimeout(() => { ui.toast.hidden = true; }, 4200);
}
function draw() {
  if (!deck.length) {
    deck = phrases.map((_,i) => i).filter(i => i !== index);
    for (let i = deck.length-1;i>0;i--) { const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  }
  return deck.pop();
}
function strike() {
  if (!sound || !active || !audio || audio.state !== 'running') return;
  try {
    const length = Math.floor(audio.sampleRate * .085);
    const buffer = audio.createBuffer(1,length,audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<length;i++) data[i] = (Math.random()*2-1)*Math.exp(-i/(length*.12));
    const source = audio.createBufferSource(); source.buffer = buffer;
    const filter = audio.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1500; filter.Q.value=.6;
    const gain = audio.createGain(); gain.gain.value=.45;
    source.connect(filter); filter.connect(gain); gain.connect(audio.destination);
    source.start(); source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};
  } catch (_) { sound=false;updateButtons();toast('音を再生できませんでした。'); }
}
function present(selected) {
  if (!active) return;
  index = Number.isInteger(selected) ? selected : draw();
  const [text,stamp] = phrases[index];
  count++; ui.recipient.textContent = addressed(name) + '！'; ui.quote.textContent=text;
  ui.stamp.textContent=stamp;ui.count.textContent='第' + count + '席';
  ui.liveMessage.textContent=addressed(name)+'！ '+text;
  ui.performance.classList.remove('new');void ui.performance.offsetWidth;ui.performance.classList.add('new');
  strike();
}
function schedule() {
  clearInterval(timer);timer=null;
  if (active && auto && !document.hidden) timer=setInterval(()=>present(),6500);
}
function updateButtons() {
  ui.autoButton.textContent='自動：'+(auto?'オン':'オフ'); ui.autoButton.setAttribute('aria-pressed',String(auto));
  ui.soundButton.textContent='張り扇の音：'+(sound?'オン':'オフ');ui.soundButton.setAttribute('aria-pressed',String(sound));
}
function start(event) {
  event.preventDefault();name=clean(ui.personName.value);
  if (!name) { ui.personName.setCustomValidity('お名前を入れてください。');ui.personName.reportValidity();return; }
  active=true;count=0;deck=[];index=-1;
  ui.setupPage.hidden=true;ui.stage.hidden=false;
  present(giftIndex);giftIndex=null;updateButtons();schedule();
  window.scrollTo(0,0);ui.recipient.focus({preventScroll:true});
}
function back(event) {
  event?.preventDefault();active=false;clearInterval(timer);timer=null;
  ui.stage.hidden=true;ui.setupPage.hidden=false;ui.personName.focus();
}
function giftUrl() {
  const url=new URL(location.href);url.search='';url.hash=new URLSearchParams({gift:'1',to:name,p:String(index)}).toString();
  return url.toString();
}
async function share() {
  if (!active) return;
  const title='お見事！｜あなたを褒める講談';
  const text=addressed(name)+'！ '+phrases[index][0];
  const published=/^https?:$/.test(location.protocol) && !['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  const url=published?giftUrl():null;
  const payload=url?{title,text,url}:{title,text};
  if(navigator.share) {
    try{await navigator.share(payload);return;}catch(error){if(error.name==='AbortError')return;}
  }
  const copy=url?text+'\n'+url:text;
  try{
    if(!navigator.clipboard || !window.isSecureContext)throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(copy);toast(url?'この一席のリンクをコピーしました。':'褒め言葉をコピーしました。リンクは公開後に贈れます。');
  }catch(_){window.prompt('コピーして贈ってください。',copy);}
}
ui.setupForm.addEventListener('submit',start);
ui.personName.addEventListener('input',()=>{ui.personName.setCustomValidity('');giftIndex=null;});
ui.nextButton.addEventListener('click',()=>{present();schedule();});
ui.backButton.addEventListener('click',back);ui.homeLink.addEventListener('click',back);
ui.autoButton.addEventListener('click',()=>{auto=!auto;updateButtons();schedule();});
ui.soundButton.addEventListener('click',async()=>{
  sound=!sound;updateButtons();if(!sound)return;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('unsupported');
    if(!audio)audio=new Audio();await audio.resume();strike();
  }catch(_){sound=false;updateButtons();toast('このブラウザでは音を再生できません。');}
});
ui.shareButton.addEventListener('click',share);
document.addEventListener('visibilitychange',schedule);
window.addEventListener('pagehide',()=>{clearInterval(timer);timer=null;});
window.addEventListener('pageshow',schedule);
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&active)back();});
const params=new URLSearchParams(location.hash.slice(1));
const to=clean(params.get('to'));
if(params.get('gift')==='1'&&to){
  ui.personName.value=to;ui.giftNotice.hidden=false;ui.giftNotice.textContent=addressed(to)+'へ、褒める一席が届いています。';
  const p=params.get('p');
  if(p!==null&&/^\d+$/.test(p)&&Number(p)<phrases.length)giftIndex=Number(p);
}
})();
</script>
</body>
</html>
