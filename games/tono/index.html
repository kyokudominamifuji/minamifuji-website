/* v1.2: 和風絵巻・小判のデザイン */
:root{--paper:#fbf0db;--surface:#fffaf0;--ink:#291e15;--muted:#675c4a;--red:#a32127;--gold:#bf913e;--line:#e0cba7;--pale:#efe0c3;--shadow:0 15px 35px rgba(88,46,21,.14)}
html{background:#f9edda}
body{background-color:var(--paper);background-image:radial-gradient(ellipse at 2% 8%,rgba(207,160,78,.21),transparent 30%),radial-gradient(ellipse at 98% 35%,rgba(181,37,34,.07),transparent 30%),repeating-radial-gradient(circle at 50% 120%,transparent 0 12px,rgba(178,129,53,.055) 13px 14px,transparent 15px 24px);background-size:auto,auto,96px 48px}
.shell{max-width:660px;padding:13px 13px max(44px,env(safe-area-inset-bottom))}
.mast{margin-bottom:9px;padding:4px 5px 11px;border-bottom:2px solid rgba(184,131,53,.4)}
.brand{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(17px,4.5vw,23px);letter-spacing:.025em;color:#20170f}
.brand-seal{width:40px;height:40px;min-width:40px;font-size:24px;background:linear-gradient(135deg,#af222a,#80151b);box-shadow:0 3px 0 #6e1118,0 5px 8px rgba(75,21,15,.18)}
.mast .badge{background:#fff4d8;color:#704d22;border:1px solid #c9a363}
.paper{background:linear-gradient(140deg,rgba(255,252,243,.97),rgba(255,246,225,.96));border:2px solid #d5b276;border-radius:22px;box-shadow:var(--shadow),inset 0 0 0 6px rgba(255,255,255,.5);padding:clamp(15px,4.5vw,27px)}
.paper:before,.paper:after{background:linear-gradient(90deg,transparent,#ac792e 15%,#d5ad62 50%,#ac792e 85%,transparent);opacity:.65}
.eyebrow{font-size:13px;color:#9d2625}
.page-title{color:#281c13}
.btn-main{background:linear-gradient(180deg,#bd2c2e,#911c22);box-shadow:0 5px 0 #71141a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px}
.btn-main:active:not(:disabled){box-shadow:0 2px 0 #71141a}
.question-card{background:linear-gradient(130deg,#fff9ec,#f7e9cc);border:2px solid #d4b273;box-shadow:inset 0 0 0 4px rgba(255,255,255,.48)}
.rule-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:19px 0 23px}
.rule-chip{border:1px solid #d8b983;border-radius:12px;background:#fffaf1;box-shadow:0 2px 0 #e9d8b9;display:flex;justify-content:center;align-items:center;gap:7px;padding:10px 5px;font-size:13px;color:#6b441d}
.rule-chip strong{font-weight:900}
.hero-banner{position:relative;isolation:isolate;min-height:254px;display:flex;align-items:center;margin:-10px -10px 11px;padding:18px 0 22px 18px;overflow:hidden;border-radius:16px 16px 9px 9px;background:radial-gradient(ellipse at 75% 33%,rgba(229,186,107,.35),transparent 55%),linear-gradient(120deg,#fff7e9,#f6e5c6)}
.hero-banner:before{content:"";position:absolute;right:-53px;top:-65px;width:220px;height:148px;background:repeating-linear-gradient(24deg,rgba(135,24,26,.32) 0 2px,transparent 2px 23px),linear-gradient(130deg,#d2533e,#8e1722);border-radius:0 0 40% 70%;transform:rotate(8deg);z-index:-1;box-shadow:0 5px 0 rgba(156,56,27,.2)}
.hero-banner:after{content:"❀";position:absolute;right:11px;top:73px;color:#b02d29;font-size:28px;text-shadow:18px 19px 0 #d59860,-18px 44px 0 #e8ae8d}
.hero-content{position:relative;z-index:2;width:60%;align-self:flex-start;padding-top:14px}
.hero-kicker{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#a52025;font-size:clamp(14px,3.5vw,21px);font-weight:900;letter-spacing:.06em;white-space:nowrap;transform:rotate(-4deg);margin-bottom:7px}
.hero-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(38px,10vw,65px);line-height:1.08;color:#1b150f;font-weight:900;letter-spacing:-.07em;white-space:nowrap;margin:6px 0 0;text-shadow:2px 2px 0 #fff8e6,0 0 15px #fff8e6}
.hero-title span{display:block}.hero-title .red{color:#a01920}
.hero-tag{display:inline-block;margin-top:12px;background:#fff4d5;border:1px solid #c99f59;color:#8b241f;border-radius:50px;padding:3px 12px;font-weight:900;font-size:clamp(11px,3vw,14px)}
.hero-art{width:62%;max-width:340px;position:absolute;right:-14px;bottom:-7px;z-index:1;filter:drop-shadow(0 3px 1px rgba(86,58,25,.12))}
.intro{text-align:center;color:#3a3126;font-size:clamp(14px,3.8vw,17px);margin:13px 0}.intro strong{color:var(--red)}
.quick-guide{background:linear-gradient(145deg,#fffdf6,#f8eddb);border:2px solid #dbbd84;padding:14px 13px 15px;border-radius:20px;box-shadow:inset 0 0 0 4px #fffaf0}
.quick-head{background:linear-gradient(110deg,#a81c25,#7e141d);border:2px solid #ca8152;box-shadow:0 3px 0 #e1bf86;color:#fff9e6;margin:-21px 0 13px;padding:12px 9px;border-radius:11px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(18px,5.3vw,27px);text-align:center}
.quick-step{grid-template-columns:46px 1fr;gap:12px;padding:12px 1px}
.quick-step strong{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;color:#241d16}
.quick-step span:not(.quick-num){font-size:14px;color:#4f4436}
.quick-num{background:#a6222a;border:2px solid #f0dabc;box-shadow:0 1px 0 #78161b;width:42px;height:42px;font-family:serif;font-size:25px}

.quick-example strong{color:#a02327}

.quick-finish strong{display:block;color:#a21f26;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(16px,4.5vw,21px);line-height:1.4}

.coin-small{width:20px;height:31px;font-size:10px;border-width:1px;box-shadow:inset 0 0 0 2px #f7e29d,0 2px 3px rgba(100,70,10,.14)}
.score-point{display:flex;align-items:center;gap:7px;justify-content:flex-end;color:#905321;font-size:19px}
.award-spotlight{display:flex;align-items:center;gap:17px;background:linear-gradient(130deg,#fff6d9,#f7dc9b);border:2px solid #d2a95d;padding:14px;border-radius:16px;margin:17px 0 22px}
.award-spotlight strong{display:block;font-size:21px;font-weight:900;color:#a01e24;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.35}

.footer{color:#856a43}

}殿の家の壁がしゃべったら、何を聞く？"},{"id":95,"category":"もしもの日常","text":"{lord}殿に未来から荷物が届いた！ 中身は何？"},{"id":96,"category":"もしもの日常","text":"{lord}殿が明日だけ有名人になったら、何をする？"},{"id":97,"category":"もしもの日常","text":"{lord}殿が魔法の道具を一つもらえるなら、何を選ぶ？"},{"id":98,"category":"もしもの日常","text":"{lord}殿が昔の楽しい日に戻るなら、いつを選ぶ？"},{"id":99,"category":"もしもの日常","text":"{lord}殿が一日だけ子どもに戻るなら、何をする？"},{"id":100,"category":"もしもの日常","text":"{lord}殿が今日は何でも成功するなら、何に挑戦する？"}];
const STORAGE_KEY='tono-no-okimochi-proto-v2';
const TIME_LIMIT=60;
const MAX_CHARS=40;
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glyphs=str=>typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(str)].map(x=>x.segment):Array.from(str);
const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const questionById=id=>QUESTIONS.find(q=>q.id===id);
const fresh=players=>({version:1,stage:'pick',players,round:0,usedQuestions:[],candidates:[],questionId:null,answerOrder:[],answerIndex:0,deadline:null,draft:'',entries:[],groups:[],shuffledIds:[],rankIds:[],rankConfirm:false,revealIndex:0,scores:Object.fromEntries(players.map(p=>[p.id,0])),scoredRound:-1});
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){}
if(!state||state.version!==1||!Array.isArray(state.players)||!state.players.length||!state.stage)state={stage:'setup',players:[],version:1};
let names=['','','',''];
let judgeSelection=new Set();
let dragging=null;
const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}};
const player=id=>state.players.find(p=>p.id===id);
function playerName(id){const p=player(id);if(!p)return '名もなき家臣';const same=state.players.filter(x=>x.name===p.name);if(same.length<2)return p.name;return p.name+'（'+(same.findIndex(x=>x.id===id)+1)+'）'}
const lordId=()=>state.players[state.round]?.id;
const validEntries=()=>state.entries.filter(e=>e.status==='submitted'&&!state.groups.some(g=>g.ids.includes(e.id)));
const timeouts=()=>state.entries.filter(e=>e.status==='timeout').length;
const submittedById=id=>state.entries.find(e=>e.id===id);
function beginRound(index){state.round=index;state.entries=[];state.groups=[];state.rankIds=[];state.rankConfirm=false;state.revealIndex=0;state.questionId=null;state.answerIndex=0;state.deadline=null;state.draft='';const cats=shuffle([...new Set(QUESTIONS.map(q=>q.category))]);const unused=QUESTIONS.filter(q=>!state.usedQuestions.includes(q.id));const chosen=[];for(const category of cats){const available=unused.filter(q=>q.category===category&&!chosen.some(t=>t.id===q.id));if(available.length)chosen.push(shuffle(available)[0]);if(chosen.length===3)break}if(chosen.length<3)chosen.push(...shuffle(unused.filter(q=>!chosen.some(t=>t.id===q.id))).slice(0,3-chosen.length));state.candidates=shuffle(chosen).map(q=>q.id);state.usedQuestions.push(...state.candidates);state.stage='pick';judgeSelection.clear();persist();render(true)}
function answerOrder(){const n=state.players.length;return Array.from({length:n-1},(_,i)=>state.players[(state.round+i+1)%n].id)}
function selectQuestion(id){if(!state.candidates.includes(id))return;state.questionId=id;state.answerOrder=answerOrder();state.answerIndex=0;state.stage='handoff';persist();render(true)}
function startAnswer(){if(state.stage!=='handoff')return;state.stage='answer';state.deadline=Date.now()+TIME_LIMIT*1000;state.draft='';persist();render(true);$('.answer-field')?.focus()}
function nextAnswer(status,text){if(state.stage!=='answer')return;const id=`e${state.round}-${state.answerIndex}`;state.entries.push({id,playerId:state.answerOrder[state.answerIndex],status,text:status==='submitted'?text:''});state.answerIndex++;state.deadline=null;state.draft='';if(state.answerIndex>=state.answerOrder.length){state.stage='judge-handoff'}else{state.stage='handoff'}persist();render(true)}
function submitAnswer(){if(state.stage!=='answer')return;if(Date.now()>=state.deadline){nextAnswer('timeout','');return}const content=state.draft.trim();if(!content||glyphs(content).length>MAX_CHARS)return;nextAnswer('submitted',content)}
function timeoutAnswer(){if(state.stage==='answer'){nextAnswer('timeout','')}}
function enterJudge(){if(state.stage!=='judge-handoff')return;state.shuffledIds=shuffle(state.entries.filter(e=>e.status==='submitted').map(e=>e.id));judgeSelection.clear();state.stage='judge';persist();render(true)}
function toggleDup(id){if(state.groups.some(g=>g.ids.includes(id)))return;if(judgeSelection.has(id))judgeSelection.delete(id);else judgeSelection.add(id);render(false)}
function groupDup(){const ids=[...judgeSelection];if(ids.length<2||ids.some(id=>state.groups.some(g=>g.ids.includes(id))))return;state.groups.push({ids});judgeSelection.clear();persist();render(false)}
function removeGroup(i){state.groups.splice(i,1);judgeSelection.clear();persist();render(false)}
function enterRank(){judgeSelection.clear();const ids=validEntries().map(e=>e.id);const kept=state.rankIds.filter(id=>ids.includes(id));state.rankIds=[...kept,...state.shuffledIds.filter(id=>ids.includes(id)&&!kept.includes(id))];state.rankConfirm=false;state.stage='rank';persist();render(true)}
function moveRank(from,to){if(from<0||to<0||from>=state.rankIds.length||to>=state.rankIds.length||from===to)return;const [id]=state.rankIds.splice(from,1);state.rankIds.splice(to,0,id);persist();render(false)}
function finalizeRank(){if(state.stage!=='rank')return;state.rankConfirm=false;state.stage='results';persist();render(true)}
function showScoreboard(){if(state.scoredRound!==state.round){if(state.rankIds.length){const winner=submittedById(state.rankIds[0]);if(winner)state.scores[winner.playerId]=(state.scores[winner.playerId]||0)+1}state.scoredRound=state.round}state.stage='scoreboard';persist();render(true)}
function proceedRound(){if(state.round+1>=state.players.length){state.stage='end';persist();render(true)}else beginRound(state.round+1)}
function replay(){const p=state.players.map(x=>({...x}));state=fresh(p);beginRound(0)}
function reset(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}state={stage:'setup',players:[],version:1};names=['','','',''];render(true)}
function maybeReset(){if(confirm('最初からやり直しますか？ 今までの小判は消えます。'))reset()}
function layout(body,subtitle=''){if(state.stage==='setup')return body+'<div class="footer">旭堂南不二 · 殿のお気持ち · v1.3</div>';const stage=state.stage;const count=state.players?.length||0;const playing=stage!=='setup';return `<header class="mast"><div class="brand"><span class="brand-seal">殿</span><div>殿のお気持ち${subtitle?`<div><small>${escapeHtml(subtitle)}</small></div>`:''}</div></div>${playing?`<div class="flex"><span class="pill">${state.round+1}回目 / 全${count}回</span><button class="quiet-btn" data-action="reset">最初から</button></div>`:'<span class="badge">一両小判版 v1.2</span>'}</header><section class="paper slide-enter">${body}</section><div class="footer">日常のお題で遊ぶ、殿と家臣のゲーム。<br>この端末だけで遊べます ・ v1.2</div>`}

123\" stroke=\"#a36d33\" stroke-width=\"2\"/>\n<circle cx=\"18\" cy=\"166\" r=\"8\" fill=\"#673b20\" stroke=\"#352820\" stroke-width=\"3\"/>\n</g>\n</svg>";
function renderSetup(){return `<div class="setup-art"><img src="assets/tono-top-v1.3.jpeg" width="864" height="1536" fetchpriority="high" alt="殿のお気持ち。スマホ1台で4〜6人。お題100問、回答60秒、40文字以内。殿が3つからお題を選び、家臣が殿の気持ちを予想して回答。殿は回答しません。同じ意味の答えは小判なし。一番好きな答えの家臣に一両小判。全員が一度ずつ殿を務めたら獲得した両で勝負！"></div><section class="setup-panel" aria-label="ゲームの参加設定"><h1 class="sr-only">殿のお気持ち</h1><h2>❀　参加人数　❀</h2><div class="side-controls"><button type="button" class="btn-icon" data-action="less" aria-label="人数を減らす" ${names.length<=4?'disabled':''}>−</button><span class="number" aria-live="polite">${names.length}<span class="small">人</span></span><button type="button" class="btn-icon" data-action="more" aria-label="人数を増やす" ${names.length>=6?'disabled':''}>＋</button></div><h2>参加者の名前を入力</h2><div class="players-list">${names.map((n,i)=>`<div class="field"><label for="name${i}">${i+1}人目の名前</label><input id="name${i}" data-name-index="${i}" maxlength="14" autocomplete="off" placeholder="お名前・呼び名" value="${escapeHtml(n)}"></div>`).join('')}</div><div class="mt"><button type="button" class="btn btn-main" data-action="start">ゲームを始める　›</button></div><div class="mt"><button type="button" class="btn btn-outline" data-action="demo">🎲 名前を自動で入れる（お試し）</button></div><p class="note">全員の名前を入力して始めよう。<br>同じ両数なら、どちらも優勝！</p></section>`}
function lordLabel(){const name=playerName(lordId()).trim();return name.endsWith("殿")?name:name+"殿"}
function personalQuestion(question){return question.text.replace(/^\{lord\}殿[がはのに]/,'')}
function questionMarkup(question){return `<span class="question-topic">${escapeHtml("さて、"+lordLabel()+"のお気持ちは？")}</span><span class="question-content">${escapeHtml(personalQuestion(question))}</span>`}
function renderPick(){return `<div class="eyebrow">${state.round+1}回目・お題を選ぼう</div><h1 class="page-title">今回の殿：${escapeHtml(playerName(lordId()))}</h1><p class="copy">殿だけが見てね。3つの中からお題を1つ選ぼう。</p><div class="pick-question-head">さて、${escapeHtml(lordLabel())}のお気持ちは？</div><div class="stack">${state.candidates.map((id,i)=>{const q=questionById(id);return `<button class="choice" data-action="choose" data-id="${id}"><small>お題 ${i+1} ・ ${escapeHtml(q.category)}</small><strong>${escapeHtml(personalQuestion(q))}</strong></button>`}).join('')}</div><div class="notice">選んだお題は、家臣が「答え始める」を押すまで見えません。</div>`}
function renderHandoff(){const id=state.answerOrder[state.answerIndex];return `<div class="eyebrow">次の人にスマホを渡そう</div><div class="handoff-emblem">📜</div><div class="center"><p class="small">次はこの人！</p><div class="handoff-name mincho">${escapeHtml(playerName(id))}</div><p class="copy">この人にスマホを渡してね。<br>受け取ったら下のボタンを押してください。</p></div><button class="btn btn-main mt" data-action="start-answer">答え始める（60秒）</button><p class="note center">ボタンを押すと、お題が出て60秒がスタートします。</p>`}
function renderAnswer(){return `<div class="flex"><span class="eyebrow">家臣の答える番</span><span class="badge">${state.answerIndex+1} / ${state.answerOrder.length} 人目</span></div><div class="timer" id="timer" aria-label="残り時間">01:00</div><div class="progress-track"><div class="progress-fill" id="timer-fill"></div></div><div class="mt section-label">殿のお気持ちを予想して答えてね！</div><div class="question-card"><div class="question">${questionMarkup(questionById(state.questionId))}</div></div><div class="mt"><label class="section-label" for="answer">答えを書こう（40文字まで）</label><textarea class="answer-field" id="answer" maxlength="100" placeholder="思いついた答えを入力してね" autocomplete="off">${escapeHtml(state.draft)}</textarea><div class="answer-counter" id="counter">${glyphs(state.draft).length} / ${MAX_CHARS}文字</div></div><button id="submit" class="btn btn-main mt-sm" data-action="submit" ${!state.draft.trim()?'disabled':''}>この答えに決める</button><p class="note">決めた答えは変えられません。60秒たっても決めていない人は小判をもらえません。</p>`}
function renderJudgeHandoff(){return `<div class="eyebrow">みんなの答えがそろった！</div><div class="handoff-emblem">⚖️</div><h1 class="page-title center">殿が決める番</h1><p class="copy center">みんなの番が終わりました。<br>スマホを <strong>${escapeHtml(playerName(lordId()))}殿</strong> に渡してね。</p><div class="notice">ここからは殿だけが画面を見てください。だれの答えかは、まだ分かりません。</div><button class="btn btn-main" data-action="enter-judge">答えをチェックする</button>`}
function renderJudge(){const submitted=state.shuffledIds.map(submittedById);const disqualifiedIds=new Set(state.groups.flatMap(g=>g.ids));return `<div class="eyebrow">同じ答えをチェック</div><h1 class="page-title">同じような答えはある？</h1><p class="copy"><strong>同じ意味</strong>だと思う答えを2つ以上タップして、「まとめて失格」を押してください。選んだ答えはどちらも小判をもらえません。</p>${submitted.length?`<div class="stack">${submitted.map(e=>`<button data-action="select-dup" data-id="${escapeHtml(e.id)}" class="judge-row ${judgeSelection.has(e.id)?'is-selected':''} ${disqualifiedIds.has(e.id)?'is-disabled':''}" ${disqualifiedIds.has(e.id)?'disabled':''}><span class="check">${disqualifiedIds.has(e.id)?'×':judgeSelection.has(e.id)?'✓':''}</span><span class="judge-text">${escapeHtml(e.text)}</span>${disqualifiedIds.has(e.id)?'<span class="tag-danger">失格</span>':''}</button>`).join('')}</div><button class="btn btn-subtle mt-sm" data-action="group-dup" ${judgeSelection.size<2?'disabled':''}>選んだ${judgeSelection.size}個をまとめて失格</button>`:'<div class="notice">時間内に決めた答えはありません。今回は小判なしです。</div>'}<div class="groups">${state.groups.map((g,i)=>`<div class="group-box"><div class="flex"><strong>同じ答えのグループ ${i+1}</strong><button class="btn btn-outline btn-small" style="width:auto" data-action="undo-group" data-index="${i}">このグループを取り消す</button></div>${g.ids.map(id=>`<div class="group-item">・${escapeHtml(submittedById(id).text)}</div>`).join('')}</div>`).join('')}</div><div class="note">時間切れ：${timeouts()}人 ／ 同じ答えで失格：${disqualifiedIds.size}人 ／ 残った答え：${validEntries().length}個</div><button class="btn btn-main mt" data-action="enter-rank" ${judgeSelection.size?'disabled':''}>${judgeSelection.size?'選んだ答えを先に確認してね':state.groups.length?'残った答えの順番を決める':'同じような答えはないので、順番を決める'}</button>`}
function renderRank(){const items=state.rankIds.map(submittedById);return `<div class="eyebrow">殿が好きな答えを選ぶ</div><h1 class="page-title">どの答えが一番好き？</h1><p class="copy">一番好きな答えを上にしてね。右の ↑ ↓ ボタンで順番を変えられます。</p>${items.length?`<div class="stack" id="rank-list">${items.map((e,i)=>`<div class="rank-card" data-rank-id="${escapeHtml(e.id)}" draggable="true"><div class="ranknum">${i+1}<small style="font-size:12px">位</small></div><div class="ranktext">${escapeHtml(e.text)}</div><div class="rankhandle" data-drag="${escapeHtml(e.id)}" aria-label="順番をドラッグ">≡</div><div class="ranks-move"><button class="btn-icon" data-action="rank-up" data-index="${i}" aria-label="順位を上げる" ${i===0?'disabled':''}>↑</button><button class="btn-icon" data-action="rank-down" data-index="${i}" aria-label="順位を下げる" ${i===items.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`:`<div class="notice">残った答えは0個です。今回は小判なしになります。</div>`}${items.length===1?'<div class="notice">残った答えが1つなので、この答えが自動で1位になります。</div>':''}<div class="mt btn-row"><button class="btn btn-outline" data-action="back-judge">← 同じ答えをチェック</button><button class="btn btn-main" data-action="rank-finalize">この順番で決める</button></div>`}
function renderResults(){
  const ranked=state.rankIds.map((id,i)=>{const e=submittedById(id);if(!e)return '';return `<div class="all-result-row ${i===0?'champion':''}"><div class="all-result-rank">${i===0?'🏆':'第'+(i+1)+'位'}<span>${i===0?'1位':''}</span></div><div class="all-result-detail"><div class="all-result-answer">${escapeHtml(e.text)}</div><div class="all-result-name">${escapeHtml(playerName(e.playerId))}${i===0?' ・ 🪙 一両小判獲得！':''}</div></div></div>`}).join('');
  const duplicateGroups=state.groups.map((g,i)=>`<div class="disq-card"><strong>同じ答えの組 ${i+1}（みんな失格）</strong>${g.ids.map(id=>{const e=submittedById(id);return e?`<p>「${escapeHtml(e.text)}」　<strong>${escapeHtml(playerName(e.playerId))}</strong></p>`:''}).join('')}</div>`).join('');
  return `<div class="eyebrow">みんなで見よう！</div><h1 class="page-title">結果をまとめて発表！</h1><p class="copy">スマホを真ん中に置いて、みんなで見てね。</p><div class="question-card"><div class="section-label">今回のお題</div><div class="question" style="font-size:20px">${questionMarkup(questionById(state.questionId))}</div></div>${state.rankIds.length?`<div class="award-spotlight"><span class="coin coin-xl" aria-hidden="true">壱</span><div><strong>褒美として一両を授ける！</strong><p>${escapeHtml(playerName(submittedById(state.rankIds[0]).playerId))} 家臣、小判1枚を獲得！</p></div></div>`:''}<h2 class="all-results-heading">🏆 今回の順位</h2>${state.rankIds.length?ranked:'<div class="notice">今回は小判なし！ 残った答えがありませんでした。</div>'}${state.groups.length?`<h2 class="all-results-heading">同じ答えだった人（失格）</h2><div class="stack">${duplicateGroups}</div>`:''}<p class="small mt">時間切れ：${timeouts()}人${state.groups.length?' ／ 同じ答えで失格になった人：'+state.groups.reduce((n,g)=>n+g.ids.length,0)+'人':''}</p><button class="btn btn-main mt" data-action="show-scoreboard">みんなの小判を見る</button><p class="note center">どの答えが好きだったか、みんなで話してみよう！</p>`;
}
function maxScoreZero(){return state.players.every(p=>(state.scores[p.id]||0)===0)}
function leaderboardHtml(){const sorted=[...state.players].sort((a,b)=>(state.scores[b.id]||0)-(state.scores[a.id]||0));return `<div class="stack" style="gap:1px">${sorted.map(p=>{const score=state.scores[p.id]||0;const higher=sorted.filter(x=>(state.scores[x.id]||0)>score).length;const rank=higher+1;return `<div class="score-row ${rank===1&&score>0?'leader':''}"><span class="score-rank">${maxScoreZero()?'—':(rank===1&&score>0?'👑 ':'')+rank+'位'}</span><span class="score-name">${escapeHtml(playerName(p.id))}</span><span class="score-point"><span class="coin coin-small" aria-hidden="true">壱</span><span>${score}両</span></span></div>`}).join('')}</div>`}
function renderScoreboard(){const final=state.round===state.players.length-1;return `<div class="eyebrow">${state.round+1}回目が終わったよ</div><h1 class="page-title">今の小判は何両？</h1><p class="copy">殿が選んだ家臣に一両小判を1枚！ 残った答えがなければ、今回の褒美はなし。</p>${leaderboardHtml()}<div class="notice">${final?'みんなが殿を1回ずつやりました。最後の結果を見よう！':'みんなでゆっくり話してOK。準備ができたら次へ進んでね。'}</div><button class="btn btn-main mt-sm" data-action="next-round">${final?'最終結果を見る':'次の殿へ →'}</button>`}
function renderEnd(){const max=Math.max(0,...state.players.map(p=>state.scores[p.id]||0));const winners=state.players.filter(p=>(state.scores[p.id]||0)===max&&max>0);return `<div class="eyebrow">ゲーム終了！</div><div class="center"><div class="trophy">${winners.length?'🏆':'📜'}</div><h1 class="page-title">${!winners.length?'今回は勝った人なし！':winners.length===1?'優勝者が決まった！':'同点で優勝！'}</h1>${winners.length?`<div class="reveal-writer mincho">${winners.map(p=>escapeHtml(playerName(p.id))).join(' ・ ')}</div><div class="pill mt-sm">${max}両・${winners.length>1?'同点優勝':'優勝'}</div>`:'<p>今回は全員0両！<br>でも、たくさん笑えたかな？</p>'}</div><div class="divider"></div><h2 class="mincho center">最後の獲得小判</h2>${leaderboardHtml()}<div class="btn-row mt"><button class="btn btn-main" data-action="replay">同じメンバーでもう一回</button><button class="btn btn-outline" data-action="reset">名前を入れ直す</button></div><p class="note center">もう一度遊ぶと、お題も新しく選べます。</p>`}
function render(scroll=false){let view='';switch(state.stage){case 'setup':view=renderSetup();break;case 'pick':view=renderPick();break;case 'handoff':view=renderHandoff();break;case 'answer':view=renderAnswer();break;case 'judge-handoff':view=renderJudgeHandoff();break;case 'judge':view=renderJudge();break;case 'rank':view=renderRank();break;case 'results':case 'disqualified':case 'reveal':view=renderResults();break;case 'scoreboard':view=renderScoreboard();break;case 'end':view=renderEnd();break;default:state.stage='setup';view=renderSetup()}$('#app').classList.toggle('setup-shell',state.stage==='setup');$('#app').innerHTML=layout(view);if(scroll)window.scrollTo({top:0,behavior:'instant'});if(state.stage==='answer')updateTimer()}
function updateTimer(){if(state.stage!=='answer'||!state.deadline)return;const remaining=Math.max(0,state.deadline-Date.now());const t=$('#timer');if(t){t.textContent=`${String(Math.floor(Math.ceil(remaining/1000)/60)).padStart(2,'0')}:${String(Math.ceil(remaining/1000)%60).padStart(2,'0')}`;t.classList.toggle('warn',remaining<=20000&&remaining>10000);t.classList.toggle('urgent',remaining<=10000);const fill=$('#timer-fill');if(fill){fill.style.width=(remaining/(TIME_LIMIT*1000)*100)+'%';fill.className='progress-fill'+(remaining<=10000?' urgent':remaining<=20000?' warn':'')}}if(remaining<=0)timeoutAnswer()}
const app=$('#app');
app.addEventListener('input',e=>{if(e.target.matches('[data-name-index]')){names[Number(e.target.dataset.nameIndex)]=e.target.value;return}if(e.target.id==='answer'&&state.stage==='answer'){const parts=glyphs(e.target.value);if(parts.length>MAX_CHARS)e.target.value=parts.slice(0,MAX_CHARS).join('');state.draft=e.target.value;const c=$('#counter');if(c){c.textContent=`${glyphs(state.draft).length} / ${MAX_CHARS}文字`;c.classList.toggle('at-limit',glyphs(state.draft).length>=MAX_CHARS)}const b=$('#submit');if(b)b.disabled=!state.draft.trim();persist()}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const act=el.dataset.action;switch(act){case 'less':if(names.length>4){names.pop();render(false)}break;case 'more':if(names.length<6){names.push('');render(false)}break;case 'demo':names=names.map((_,i)=>['太郎','次郎','三郎','四郎','五郎','六郎'][i]);render(false);break;case 'start':{const clean=names.map(x=>x.trim());if(clean.some(x=>!x)){alert('全員の名前を入れてください。');return}state=fresh(clean.map((name,i)=>({id:`p${i}`,name})));beginRound(0);break}case 'choose':selectQuestion(Number(el.dataset.id));break;case 'start-answer':startAnswer();break;case 'submit':submitAnswer();break;case 'enter-judge':enterJudge();break;case 'select-dup':toggleDup(el.dataset.id);break;case 'group-dup':groupDup();break;case 'undo-group':removeGroup(Number(el.dataset.index));break;case 'enter-rank':enterRank();break;case 'back-judge':state.rankConfirm=false;state.stage='judge';persist();render(true);break;case 'rank-up':moveRank(Number(el.dataset.index),Number(el.dataset.index)-1);break;case 'rank-down':moveRank(Number(el.dataset.index),Number(el.dataset.index)+1);break;case 'rank-finalize':finalizeRank();break;case 'show-scoreboard':showScoreboard();break;case 'next-round':proceedRound();break;case 'replay':replay();break;case 'reset':maybeReset();break;}});
// Native drag-and-drop (desktop): also provide button and touch-pointer alternatives.
app.addEventListener('dragstart',e=>{const row=e.target.closest('.rank-card');if(!row||state.stage!=='rank')return;dragging={id:row.dataset.rankId};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging.id);row.classList.add('is-dragging')});
app.addEventListener('dragover',e=>{const row=e.target.closest('.rank-card');if(!row||state.stage!=='rank')return;e.preventDefault();row.classList.add('is-over')});
app.addEventListener('dragleave',e=>{e.target.closest('.rank-card')?.classList.remove('is-over')});
app.addEventListener('drop',e=>{const row=e.target.closest('.rank-card');if(!row||!dragging)return;e.preventDefault();const from=state.rankIds.indexOf(dragging.id),to=state.rankIds.indexOf(row.dataset.rankId);dragging=null;moveRank(from,to)});
app.addEventListener('dragend',()=>{dragging=null;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-dragging','is-over'))});
// Touch-friendly drag handle: capture pointer so moving a finger reorders the card.
app.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h||state.stage!=='rank'||e.pointerType==='mouse')return;dragging={id:h.dataset.drag,pointer:e.pointerId,target:null};h.setPointerCapture(e.pointerId);h.closest('.rank-card')?.classList.add('is-dragging')});
app.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over'));const elem=document.elementFromPoint(e.clientX,e.clientY);const row=elem?.closest('.rank-card');if(row){dragging.target=row.dataset.rankId;row.classList.add('is-over')}});
app.addEventListener('pointerup',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const from=state.rankIds.indexOf(dragging.id),to=state.rankIds.indexOf(dragging.target);dragging=null;if(to>=0)moveRank(from,to);else app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over','is-dragging'))});
app.addEventListener('pointercancel',()=>{dragging=null;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over','is-dragging'))});
setInterval(updateTimer,140);
window.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});
render();
</script>
</body></html>
