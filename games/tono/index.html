let state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){}
if(!state||state.version!==1||!Array.isArray(state.players)||!state.players.length||!state.stage)state={stage:'setup',players:[],version:1};
let names=['','','',''];
let judgeSelection=new Set();
let dragging=null;
const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}};
const player=id=>state.players.find(p=>p.id===id);
function playerName(id){const p=player(id);if(!p)return '名もなき家臣';const same=state.players.filter(x=>x.name===p.name);if(same.length<2)return p.name;return p.name+'（'+(same.findIndex(x=>x.id===id)+1)+'）'}
const lordId=()=>state.players[state.round]?.id;
const validEntries=()=>state.entries.filter(e=>e.status==='submitted'&&!state.groups.some(g=>g.ids.includes(e.id)));
const timeouts=()=>state.entries.filter(e=>e.status==='timeout').length;
const submittedById=id=>state.entries.find(e=>e.id===id);
function beginRound(index){state.round=index;state.entries=[];state.groups=[];state.rankIds=[];state.rankConfirm=false;state.revealIndex=0;state.questionId=null;state.answerIndex=0;state.deadline=null;state.draft='';const cats=shuffle([...new Set(QUESTIONS.map(q=>q.category))]);const unused=QUESTIONS.filter(q=>!state.usedQuestions.includes(q.id));const chosen=[];for(const category of cats){const available=unused.filter(q=>q.category===category&&!chosen.some(t=>t.id===q.id));if(available.length)chosen.push(shuffle(available)[0]);if(chosen.length===3)break}if(chosen.length<3)chosen.push(...shuffle(unused.filter(q=>!chosen.some(t=>t.id===q.id))).slice(0,3-chosen.length));state.candidates=shuffle(chosen).map(q=>q.id);state.usedQuestions.push(...state.candidates);state.stage='pick';judgeSelection.clear();persist();render(true)}
function answerOrder(){const n=state.players.length;return Array.from({length:n-1},(_,i)=>state.players[(state.round+i+1)%n].id)}
function selectQuestion(id){if(!state.candidates.includes(id))return;state.questionId=id;state.answerOrder=answerOrder();state.answerIndex=0;state.stage='handoff';persist();render(true)}
function startAnswer(){if(state.stage!=='handoff')return;state.stage='answer';state.deadline=Date.now()+TIME_LIMIT*1000;state.draft='';persist();render(true);$('.answer-field')?.focus()}
function nextAnswer(status,text){if(state.stage!=='answer')return;const id=`e${state.round}-${state.answerIndex}`;state.entries.push({id,playerId:state.answerOrder[state.answerIndex],status,text:status==='submitted'?text:''});state.answerIndex++;state.deadline=null;state.draft='';if(state.answerIndex>=state.answerOrder.length){state.stage='judge-handoff'}else{state.stage='handoff'}persist();render(true)}
function submitAnswer(){if(state.stage!=='answer')return;if(Date.now()>=state.deadline){nextAnswer('timeout','');return}const content=state.draft.trim();if(!content||glyphs(content).length>MAX_CHARS)return;nextAnswer('submitted',content)}
function timeoutAnswer(){if(state.stage==='answer'){nextAnswer('timeout','')}}
function enterJudge(){if(state.stage!=='judge-handoff')return;state.shuffledIds=shuffle(state.entries.filter(e=>e.status==='submitted').map(e=>e.id));judgeSelection.clear();state.stage='judge';persist();render(true)}
function toggleDup(id){if(state.groups.some(g=>g.ids.includes(id)))return;if(judgeSelection.has(id))judgeSelection.delete(id);else judgeSelection.add(id);render(false)}
function groupDup(){const ids=[...judgeSelection];if(ids.length<2||ids.some(id=>state.groups.some(g=>g.ids.includes(id))))return;state.groups.push({ids});judgeSelection.clear();persist();render(false)}
function removeGroup(i){state.groups.splice(i,1);judgeSelection.clear();persist();render(false)}
function enterRank(){judgeSelection.clear();const ids=validEntries().map(e=>e.id);const kept=state.rankIds.filter(id=>ids.includes(id));state.rankIds=[...kept,...state.shuffledIds.filter(id=>ids.includes(id)&&!kept.includes(id))];state.rankConfirm=false;state.stage='rank';persist();render(true)}
function moveRank(from,to){if(from<0||to<0||from>=state.rankIds.length||to>=state.rankIds.length||from===to)return;const [id]=state.rankIds.splice(from,1);state.rankIds.splice(to,0,id);persist();render(false)}
function finalizeRank(){if(!state.rankConfirm)return;state.rankConfirm=false;state.stage='disqualified';persist();render(true)}
function startReveal(){state.revealIndex=0;if(state.rankIds.length===0){showScoreboard();return}state.stage='reveal';persist();render(true)}
function nextReveal(){if(state.revealIndex+1>=state.rankIds.length){showScoreboard();return}state.revealIndex++;persist();render(true)}
function showScoreboard(){if(state.scoredRound!==state.round){if(state.rankIds.length){const winner=submittedById(state.rankIds[0]);if(winner)state.scores[winner.playerId]=(state.scores[winner.playerId]||0)+1}state.scoredRound=state.round}state.stage='scoreboard';persist();render(true)}
function proceedRound(){if(state.round+1>=state.players.length){state.stage='end';persist();render(true)}else beginRound(state.round+1)}
function replay(){const p=state.players.map(x=>({...x}));state=fresh(p);beginRound(0)}
function reset(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}state={stage:'setup',players:[],version:1};names=['','','',''];render(true)}
function maybeReset(){if(confirm('初めからやり直しますか？ この勝負の記録は消えます。'))reset()}
function layout(body,subtitle=''){const stage=state.stage;const count=state.players?.length||0;const playing=stage!=='setup';return `<header class="mast"><div class="brand"><span class="brand-seal">殿</span><div>殿のお気持ち${subtitle?`<div><small>${escapeHtml(subtitle)}</small></div>`:''}</div></div>${playing?`<div class="flex"><span class="pill">第${state.round+1}陣 / 全${count}陣</span><button class="quiet-btn" data-action="reset">最初から</button></div>`:'<span class="badge">試作版</span>'}</header><section class="paper slide-enter">${body}</section><div class="footer">日常に笑いを。言葉にちょっと講談を。<br>端末内だけで動く、オフライン対応の試作品</div>`}
function renderSetup(){return `<div class="eyebrow">講談風・みんなで大喜利</div><h1 class="page-title">殿のお気持ち</h1><div class="copy">殿の心を動かすのは、いずれの家臣か。<br>スマホ一台を回して遊ぶ、笑いの知恵比べ。</div><div class="rule-chips"><span class="rule-chip">4〜6人</span><span class="rule-chip">お題100問</span><span class="rule-chip">回答60秒</span><span class="rule-chip">40文字以内</span></div><div class="divider"></div><div class="section-label">まずは家臣の名を登録せよ</div><div class="side-controls"><button class="btn-icon" data-action="less" aria-label="人数を減らす" ${names.length<=4?'disabled':''}>−</button><span class="number">${names.length}<span class="small">人</span></span><button class="btn-icon" data-action="more" aria-label="人数を増やす" ${names.length>=6?'disabled':''}>＋</button></div><div class="players-list">${names.map((n,i)=>`<div class="field"><label for="name${i}">家臣・其の${['一','二','三','四','五','六'][i]}</label><input id="name${i}" data-name-index="${i}" maxlength="14" autocomplete="off" placeholder="お名前・呼び名" value="${escapeHtml(n)}"></div>`).join('')}</div><div class="mt"><button class="btn btn-main" data-action="start">いざ、開幕！</button></div><div class="mt-sm"><button class="btn btn-outline btn-small" data-action="demo">お試し用の名前を入れる</button></div><p class="note">登録順に全員が1回ずつ殿になります。1位だけに1点。最高得点が同じなら同点優勝です。</p>`}
function renderPick(){return `<div class="eyebrow">第${state.round+1}陣　殿のお題選び</div><h1 class="page-title">${escapeHtml(playerName(lordId()))}殿、ご登場！</h1><p class="copy">殿だけが画面をご覧くだされ。三つのお題から、お好きなものを一つお選びくだされ。</p><div class="stack">${state.candidates.map((id,i)=>{const q=questionById(id);return `<button class="choice" data-action="choose" data-id="${id}"><small>其の${['一','二','三'][i]} ・ ${escapeHtml(q.category)}</small><strong>${escapeHtml(q.text)}</strong></button>`}).join('')}</div><div class="notice">お題選択後は内容を隠します。家臣は自分の「回答開始」を押すまでお題を見られません。</div>`}
function renderHandoff(){const id=state.answerOrder[state.answerIndex];return `<div class="eyebrow">家臣への受け渡し</div><div class="handoff-emblem">📜</div><div class="center"><p class="small">すまほをお渡しくだされ</p><div class="handoff-name mincho">${escapeHtml(playerName(id))}</div><p class="copy">ほかの家臣には画面を見せず、<br>受け取った本人が下のボタンを押すべし。</p></div><button class="btn btn-main mt" data-action="start-answer">回答開始 ・ 60秒！</button><p class="note center">お題はボタンを押した瞬間に現れます。受け渡し時間は計測しません。</p>`}
function renderAnswer(){return `<div class="flex"><span class="eyebrow">家臣の知恵比べ</span><span class="badge">${state.answerIndex+1} / ${state.answerOrder.length} 人目</span></div><div class="timer" id="timer" aria-label="残り時間">01:00</div><div class="progress-track"><div class="progress-fill" id="timer-fill"></div></div><div class="mt section-label">これが殿からのお題じゃ！</div><div class="question-card"><div class="question">${escapeHtml(questionById(state.questionId).text)}</div></div><div class="mt"><label class="section-label" for="answer">家臣の答え（40文字以内）</label><textarea class="answer-field" id="answer" maxlength="100" placeholder="ひらめきを書き込むべし！" autocomplete="off">${escapeHtml(state.draft)}</textarea><div class="answer-counter" id="counter">${glyphs(state.draft).length} / ${MAX_CHARS}文字</div></div><button id="submit" class="btn btn-main mt-sm" data-action="submit" ${!state.draft.trim()?'disabled':''}>これにて回答確定！</button><p class="note">確定後は修正できません。時間切れで未確定なら0点です。</p>`}
function renderJudgeHandoff(){return `<div class="eyebrow">回答、出揃い候</div><div class="handoff-emblem">⚖️</div><h1 class="page-title center">殿のお裁き</h1><p class="copy center">回答がすべて出揃いました。<br>すまほを <strong>${escapeHtml(playerName(lordId()))}殿</strong> にお渡しくだされ。</p><div class="notice">ここから順位が決まるまでは、殿だけが画面をご覧くだされ。回答した家臣の名前は表示されません。</div><button class="btn btn-main" data-action="enter-judge">殿、審判を始める</button>`}
function renderJudge(){const submitted=state.shuffledIds.map(submittedById);const disqualifiedIds=new Set(state.groups.flatMap(g=>g.ids));return `<div class="eyebrow">殿のお裁き ・ 重複判定</div><h1 class="page-title">同じ知恵は相討ちじゃ</h1><p class="copy">意味が重なる回答を<strong>2件以上</strong>選び、「重複失格」を押すべし。回答者の名前はまだ秘密です。</p>${submitted.length?`<div class="stack">${submitted.map(e=>`<button data-action="select-dup" data-id="${escapeHtml(e.id)}" class="judge-row ${judgeSelection.has(e.id)?'is-selected':''} ${disqualifiedIds.has(e.id)?'is-disabled':''}" ${disqualifiedIds.has(e.id)?'disabled':''}><span class="check">${disqualifiedIds.has(e.id)?'×':judgeSelection.has(e.id)?'✓':''}</span><span class="judge-text">${escapeHtml(e.text)}</span>${disqualifiedIds.has(e.id)?'<span class="tag-danger">失格</span>':''}</button>`).join('')}</div><button class="btn btn-subtle mt-sm" data-action="group-dup" ${judgeSelection.size<2?'disabled':''}>選んだ${judgeSelection.size}件を重複失格にする</button>`:'<div class="notice">確定した回答はありません。時間切れの家臣は全員0点です。</div>'}<div class="groups">${state.groups.map((g,i)=>`<div class="group-box"><div class="flex"><strong>重複組 其の${i+1}</strong><button class="btn btn-outline btn-small" style="width:auto" data-action="undo-group" data-index="${i}">この判定を戻す</button></div>${g.ids.map(id=>`<div class="group-item">・${escapeHtml(submittedById(id).text)}</div>`).join('')}</div>`).join('')}</div><div class="note">時間切れ：${timeouts()}名 ／ 重複失格：${disqualifiedIds.size}名 ／ 有効：${validEntries().length}名</div><button class="btn btn-main mt" data-action="enter-rank">重複判定を終える →</button>`}
function renderRank(){const items=state.rankIds.map(submittedById);return `<div class="eyebrow">殿のお裁き ・ 順位決定</div><h1 class="page-title">殿のお好みは？</h1><p class="copy">一番気に入った回答を上に。カードの「≡」を動かすか、上下ボタンで並べ替えられます。</p>${items.length?`<div class="stack" id="rank-list">${items.map((e,i)=>`<div class="rank-card" data-rank-id="${escapeHtml(e.id)}" draggable="true"><div class="ranknum">${i+1}<small style="font-size:12px">位</small></div><div class="ranktext">${escapeHtml(e.text)}</div><div class="rankhandle" data-drag="${escapeHtml(e.id)}" aria-label="順番をドラッグ">≡</div><div class="ranks-move"><button class="btn-icon" data-action="rank-up" data-index="${i}" aria-label="順位を上げる" ${i===0?'disabled':''}>↑</button><button class="btn-icon" data-action="rank-down" data-index="${i}" aria-label="順位を下げる" ${i===items.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`:`<div class="notice">有効回答は0件。今陣は勝者なし、全員0点です。</div>`}${items.length===1?'<div class="notice">有効回答は1件。自動的にこの回答が第一位となります。</div>':''}<div class="mt btn-row"><button class="btn btn-outline" data-action="back-judge">← 重複判定に戻る</button><button class="btn btn-main" data-action="rank-confirm-open">順位を確定する</button></div>${state.rankConfirm?`<div class="confirm-box"><strong>このお裁きでよろしいか？</strong><p class="small">確定後は重複判定・順位を変更できません。家臣名は確定後に公開されます。</p><div class="btn-row"><button class="btn btn-outline" data-action="rank-confirm-cancel">まだ考える</button><button class="btn btn-main" data-action="rank-finalize">これで確定！</button></div></div>`:''}`}
function renderDisqualified(){return `<div class="eyebrow">いざ、発表の段</div><h1 class="page-title">まずは相討ちの家臣</h1><div class="question-card"><div class="section-label">此度のお題</div><div class="question" style="font-size:21px">${escapeHtml(questionById(state.questionId).text)}</div></div><div class="mt"><span class="badge">時に間に合わぬ家臣：${timeouts()}名</span></div>${state.groups.length?`<div class="stack mt">${state.groups.map((g,i)=>`<div class="disq-card"><strong>重複組 ${i+1} — 相討ち！</strong>${g.ids.map(id=>{const e=submittedById(id);return `<p>「${escapeHtml(e.text)}」<br><strong>家臣・${escapeHtml(playerName(e.playerId))}</strong></p>`}).join('')}</div>`).join('')}</div>`:'<div class="notice">此度は重複による相討ち、なし！</div>'}<p class="small mt">有効回答：<strong>${state.rankIds.length}件</strong>。${state.rankIds.length?'最下位から順に披露します。':'此度の勝者はおりません。'}</p><button class="btn btn-main mt" data-action="start-reveal">${state.rankIds.length?'いざ、順位を披露！':'全員0点、番付へ'}</button>`}
function renderReveal(){const ordered=[...state.rankIds].reverse();const id=ordered[state.revealIndex];const e=submittedById(id);const rank=state.rankIds.indexOf(id)+1;const isLast=state.revealIndex===ordered.length-1;return `<div class="eyebrow">お披露目 ・ ${state.revealIndex+1} / ${ordered.length}</div><div class="reveal-outer"><div class="mincho small">${rank===1?'いよいよ、天下第一の答え！':'さて、お次の家臣は……'}</div><div class="reveal-position ${rank===1?'win':''}">${rank===1?'🏆 ':''}第${rank}位</div><div class="divider" style="margin:0 15px"></div><div class="reveal-answer">${escapeHtml(e.text)}</div><div class="small">この回答の主は</div><div class="reveal-writer mincho">家臣・${escapeHtml(playerName(e.playerId))}</div><p class="small mt">${rank===1?'あっぱれ！ この家臣に一勝を授ける！':'殿のお気持ち、いかがであろう。'}</p></div><button class="btn btn-main" data-action="next-reveal">${isLast?'講評を終えて番付へ':'次の順位を披露！'}</button><p class="note center">殿はご自由にひと言を。発表の間隔に制限はありません。</p>`}
function maxScoreZero(){return state.players.every(p=>(state.scores[p.id]||0)===0)}
function leaderboardHtml(){const sorted=[...state.players].sort((a,b)=>(state.scores[b.id]||0)-(state.scores[a.id]||0));return `<div class="stack" style="gap:1px">${sorted.map(p=>{const score=state.scores[p.id]||0;const higher=sorted.filter(x=>(state.scores[x.id]||0)>score).length;const rank=higher+1;return `<div class="score-row ${rank===1&&score>0?'leader':''}"><span class="score-rank">${maxScoreZero()?'—':(rank===1&&score>0?'👑 ':'')+rank+'位'}</span><span class="score-name">${escapeHtml(playerName(p.id))}</span><span class="score-point">${score}点</span></div>`}).join('')}</div>`}
function renderScoreboard(){const final=state.round===state.players.length-1;return `<div class="eyebrow">第${state.round+1}陣、終いに候</div><h1 class="page-title">天下取りの途中経過</h1><p class="copy">第一位に1点を授与しました。勝者なき陣は、全員0点です。</p>${leaderboardHtml()}<div class="notice">${final?'これにて全員が一度ずつ殿を務めました。いよいよ最終結果です。':'ここでしばし談笑するもよし。準備ができたら次の殿へ。'}</div><button class="btn btn-main mt-sm" data-action="next-round">${final?'最終結果を開く！':'次の殿へ →'}</button>`}
function renderEnd(){const max=Math.max(0,...state.players.map(p=>state.scores[p.id]||0));const winners=state.players.filter(p=>(state.scores[p.id]||0)===max&&max>0);return `<div class="eyebrow">これにて一巻の終わり</div><div class="center"><div class="trophy">${winners.length?'🏆':'📜'}</div><h1 class="page-title">${!winners.length?'此度の勝者なし！':winners.length===1?'天下第一の家臣、決まる！':'天下人、複数現る！'}</h1>${winners.length?`<div class="reveal-writer mincho">${winners.map(p=>escapeHtml(playerName(p.id))).join(' ・ ')}</div><div class="pill mt-sm">${max}点・${winners.length>1?'同点優勝':'優勝'}</div>`:'<p>家臣一同、勝ち名乗りなし。<br>されど笑いは天下一！</p>'}</div><div class="divider"></div><h2 class="mincho center">最終番付</h2>${leaderboardHtml()}<div class="btn-row mt"><button class="btn btn-main" data-action="replay">同じ仲間でもう一戦！</button><button class="btn btn-outline" data-action="reset">名簿からやり直す</button></div><p class="note center">もう一戦ではお題も新しく選び直します。</p>`}
function render(scroll=false){let view='';switch(state.stage){case 'setup':view=renderSetup();break;case 'pick':view=renderPick();break;case 'handoff':view=renderHandoff();break;case 'answer':view=renderAnswer();break;case 'judge-handoff':view=renderJudgeHandoff();break;case 'judge':view=renderJudge();break;case 'rank':view=renderRank();break;case 'disqualified':view=renderDisqualified();break;case 'reveal':view=renderReveal();break;case 'scoreboard':view=renderScoreboard();break;case 'end':view=renderEnd();break;default:state.stage='setup';view=renderSetup()}$('#app').innerHTML=layout(view);if(scroll)window.scrollTo({top:0,behavior:'instant'});if(state.stage==='answer')updateTimer()}
function updateTimer(){if(state.stage!=='answer'||!state.deadline)return;const remaining=Math.max(0,state.deadline-Date.now());const t=$('#timer');if(t){t.textContent=`${String(Math.floor(Math.ceil(remaining/1000)/60)).padStart(2,'0')}:${String(Math.ceil(remaining/1000)%60).padStart(2,'0')}`;t.classList.toggle('warn',remaining<=20000&&remaining>10000);t.classList.toggle('urgent',remaining<=10000);const fill=$('#timer-fill');if(fill){fill.style.width=(remaining/(TIME_LIMIT*1000)*100)+'%';fill.className='progress-fill'+(remaining<=10000?' urgent':remaining<=20000?' warn':'')}}if(remaining<=0)timeoutAnswer()}
const app=$('#app');
app.addEventListener('input',e=>{if(e.target.matches('[data-name-index]')){names[Number(e.target.dataset.nameIndex)]=e.target.value;return}if(e.target.id==='answer'&&state.stage==='answer'){const parts=glyphs(e.target.value);if(parts.length>MAX_CHARS)e.target.value=parts.slice(0,MAX_CHARS).join('');state.draft=e.target.value;const c=$('#counter');if(c){c.textContent=`${glyphs(state.draft).length} / ${MAX_CHARS}文字`;c.classList.toggle('at-limit',glyphs(state.draft).length>=MAX_CHARS)}const b=$('#submit');if(b)b.disabled=!state.draft.trim();persist()}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const act=el.dataset.action;switch(act){case 'less':if(names.length>4){names.pop();render(false)}break;case 'more':if(names.length<6){names.push('');render(false)}break;case 'demo':names=names.map((_,i)=>['太郎','次郎','三郎','四郎','五郎','六郎'][i]);render(false);break;case 'start':{const clean=names.map(x=>x.trim());if(clean.some(x=>!x)){alert('家臣全員のお名前を入れてくだされ。');return}state=fresh(clean.map((name,i)=>({id:`p${i}`,name})));beginRound(0);break}case 'choose':selectQuestion(Number(el.dataset.id));break;case 'start-answer':startAnswer();break;case 'submit':submitAnswer();break;case 'enter-judge':enterJudge();break;case 'select-dup':toggleDup(el.dataset.id);break;case 'group-dup':groupDup();break;case 'undo-group':removeGroup(Number(el.dataset.index));break;case 'enter-rank':enterRank();break;case 'back-judge':state.rankConfirm=false;state.stage='judge';persist();render(true);break;case 'rank-up':moveRank(Number(el.dataset.index),Number(el.dataset.index)-1);break;case 'rank-down':moveRank(Number(el.dataset.index),Number(el.dataset.index)+1);break;case 'rank-confirm-open':state.rankConfirm=true;persist();render(false);break;case 'rank-confirm-cancel':state.rankConfirm=false;persist();render(false);break;case 'rank-finalize':finalizeRank();break;case 'start-reveal':startReveal();break;case 'next-reveal':nextReveal();break;case 'next-round':proceedRound();break;case 'replay':replay();break;case 'reset':maybeReset();break;}});
// Native drag-and-drop (desktop): also provide button and touch-pointer alternatives.
app.addEventListener('dragstart',e=>{const row=e.target.closest('.rank-card');if(!row||state.stage!=='rank')return;dragging={id:row.dataset.rankId};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging.id);row.classList.add('is-dragging')});
app.addEventListener('dragover',e=>{const row=e.target.closest('.rank-card');if(!row||state.stage!=='rank')return;e.preventDefault();row.classList.add('is-over')});
app.addEventListener('dragleave',e=>{e.target.closest('.rank-card')?.classList.remove('is-over')});
app.addEventListener('drop',e=>{const row=e.target.closest('.rank-card');if(!row||!dragging)return;e.preventDefault();const from=state.rankIds.indexOf(dragging.id),to=state.rankIds.indexOf(row.dataset.rankId);dragging=null;moveRank(from,to)});
app.addEventListener('dragend',()=>{dragging=null;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-dragging','is-over'))});
// Touch-friendly drag handle: capture pointer so moving a finger reorders the card.
app.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h||state.stage!=='rank'||e.pointerType==='mouse')return;dragging={id:h.dataset.drag,pointer:e.pointerId,target:null};h.setPointerCapture(e.pointerId);h.closest('.rank-card')?.classList.add('is-dragging')});
app.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over'));const elem=document.elementFromPoint(e.clientX,e.clientY);const row=elem?.closest('.rank-card');if(row){dragging.target=row.dataset.rankId;row.classList.add('is-over')}});
app.addEventListener('pointerup',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const from=state.rankIds.indexOf(dragging.id),to=state.rankIds.indexOf(dragging.target);dragging=null;if(to>=0)moveRank(from,to);else app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over','is-dragging'))});
app.addEventListener('pointercancel',()=>{dragging=null;app.querySelectorAll('.rank-card').forEach(x=>x.classList.remove('is-over','is-dragging'))});
setInterval(updateTimer,140);
window.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});
render();
</script>
</body></html>
