export function shuffle(items, random = Math.random) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; }
  return result;
}
export function beginRound(state, round, random = Math.random) {
  const pool = QUESTIONS.filter(q => !state.used.includes(q.id));
  return {...state, round, stage:'pick', candidates:shuffle(pool, random).slice(0,3).map(q=>q.id), questionId:null, deadline:null};
}
export function newGame(names, random = Math.random) {
  if (names.length < 4 || names.length > 6 || names.some(n=>!n.trim())) throw Error('4〜6人全員の名前を入力してください。');
  const clean = names.map(n=>n.trim());
  if (new Set(clean).size !== clean.length) throw Error('同じ名前の人は、区別できる名前にしてください。');
  if (clean.some(n=>Array.from(n).length > 12)) throw Error('名前は12文字以内にしてください。');
  return beginRound({version:1, players:clean.map((name,id)=>({id,name})), scores:clean.map(()=>0), used:[], awards:[]},0,random);
}
export function choose(state, id) {
  if (state.stage !== 'pick' || !state.candidates.includes(id)) return state;
  return {...state, stage:'ready', questionId:id, used:[...state.used,id]};
}
export function start(state, now = Date.now()) {
  return state.stage === 'ready' ? {...state,stage:'writing',deadline:now+60000} : state;
}
export function tick(state, now = Date.now()) {
  return state.stage === 'writing' && now >= state.deadline ? {...state,stage:'judge',deadline:null} : state;
}
export function advanceAnnouncement(state, from) {
  const stages = {judge:'ranking', ranking:'reveal', reveal:'first', first:'award'};
  return state.stage === from && stages[from] ? {...state,stage:stages[from]} : state;
}
export function noEligibleAnswers(state) {
  return state.stage === 'ranking' ? award({...state,stage:'award'},null) : state;
}
export function award(state, id) {
  if (state.stage !== 'award' || state.awards.some(a=>a.round===state.round)) return state;
  if (id !== null && (!state.players.some(p=>p.id===id) || id===state.round)) return state;
  const scores = [...state.scores];
  if (id !== null) scores[id]++;
  return {...state,stage:'result',scores,awards:[...state.awards,{round:state.round,winner:id,questionId:state.questionId}]};
}
export function next(state, random = Math.random) {
  if (state.stage !== 'result') return state;
  return state.round + 1 === state.players.length ? {...state,stage:'final'} : beginRound(state,state.round+1,random);
}
export function winners(state) {
  const max = Math.max(...state.scores);
  return max > 0 ? state.players.filter(p=>state.scores[p.id]===max) : [];
}

const app = document.querySelector('#app'), KEY='tono-paper-v1';
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = null, names = ['','','',''], error = '', storageWarning = false;
try {
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved && saved.version===1 && ['pick','ready','writing','judge','ranking','reveal','first','award','result','final'].includes(saved.stage) && saved.players?.length>=4 && saved.players?.length<=6 && saved.players.every((p,i)=>p.id===i&&typeof p.name==='string') && saved.scores?.length===saved.players.length && saved.scores.every(n=>Number.isInteger(n)&&n>=0) && Number.isInteger(saved.round) && saved.round>=0 && saved.round<saved.players.length && Array.isArray(saved.used) && Array.isArray(saved.awards) && Array.isArray(saved.candidates) && saved.candidates.length===3 && saved.candidates.every(id=>QUESTIONS.some(q=>q.id===id)) && (saved.stage==='pick'||QUESTIONS.some(q=>q.id===saved.questionId)) && (saved.stage!=='writing'||Number.isFinite(saved.deadline))) state=tick(saved);
} catch {}
const lord = ()=>state.players[state.round];
const lordName = ()=>lord().name.endsWith('殿')?lord().name:lord().name+'殿';
const question = id=>QUESTIONS.find(q=>q.id===id);
const questionText = id=>question(id).text.replaceAll('{lord}殿',lordName());
const remaining = ()=>Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
function save(){try{if(state)localStorage.setItem(KEY,JSON.stringify(state));else localStorage.removeItem(KEY);}catch{storageWarning=true;}}
const button=(action,text,extra='')=>'<button type="button" class="primary" data-action="'+action+'" '+extra+'>'+text+'</button>';
const scores=()=>'<ol class="scores">'+[...state.players].sort((a,b)=>state.scores[b.id]-state.scores[a.id]).map(p=>'<li><span>'+esc(p.name)+'</span><strong><span class="coin" aria-hidden="true">壱</span> '+state.scores[p.id]+'<small>枚</small></strong></li>').join('')+'</ol>';
function render(focus=true) {
  document.querySelector('#announce').textContent='';
  let body='';
  if(!state){
    body='<div class="intro"><div class="seal">殿</div><p class="eyebrow">紙で答える・みんなで遊ぶ</p><h1>殿のお気持ち</h1><p class="lead">答えは紙に。小判はここに。</p></div>'+
    '<section class="panel"><h2>遊ぶ人の名前</h2><p>4〜6人。入力した順に殿を交代します。</p><div class="count"><button type="button" data-action="less" aria-label="参加者を1人減らす" '+(names.length===4?'disabled':'')+'>−</button><strong>'+names.length+'人</strong><button type="button" data-action="more" aria-label="参加者を1人増やす" '+(names.length===6?'disabled':'')+'>＋</button></div>'+
    '<form id="setup"><div class="names">'+names.map((name,i)=>'<label><span>'+(i+1)+'人目</span><input name="player'+i+'" data-name="'+i+'" value="'+esc(name)+'" maxlength="24" autocomplete="off" placeholder="名前" aria-label="'+(i+1)+'人目の名前" required></label>').join('')+'</div><p class="error" role="alert">'+esc(error)+'</p><button type="submit" class="primary">このメンバーで始める →</button></form></section>'+
    '<section class="rules"><h2>用意するもの</h2><p>スマホ1台と、全員分の紙・ペン。</p><ol><li>殿が3つからお題を選ぶ。</li><li>家臣は60秒で紙に答える。</li><li>殿のお気に入り1人に、小判1枚。</li></ol><p class="notice">家臣同士の回答が同じ意味だった場合、その回答を書いた家臣は全員失格になります。</p><p>スマホは中央に。殿は回答しません。<br>全員が殿を1回ずつ担当して終了です。</p><p class="small">名前と途中の記録は、この端末だけに保存します。終了音は鳴りません。</p></section>';
  }else{
    const title='<div class="round"><span>第'+(state.round+1)+'席 / 全'+state.players.length+'席</span><span>今回の殿 <b>'+esc(lordName())+'</b></span></div>';
    body=title;
    if(state.stage==='pick'){
      body+='<p class="eyebrow">殿がお題を選びます</p><h1>どのお題にする？</h1><p class="lead">3つから、ひとつ。</p><div class="choices">'+state.candidates.map((id,i)=>'<button type="button" class="question-choice" data-action="choose" data-id="'+id+'"><span class="choice-number">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(questionText(id))+'</span><span aria-hidden="true">→</span></button>').join('')+'</div>';
    }else if(state.stage==='ready'||state.stage==='writing'){
      body+='<p class="eyebrow">'+(state.stage==='ready'?'みんなでお題を見よう':'家臣は紙に回答中')+'</p><section class="question-box"><h1>'+esc(questionText(state.questionId))+'</h1></section>';
      if(state.stage==='ready')body+='<div class="ready-time"><strong>60</strong><span>秒</span></div><p class="lead">紙とペンの準備はいい？</p><p>殿以外のみんなが、同時に書きます。</p><p class="notice">殿は後ろを向いて、家臣が書いているところを見ないでください。</p><p class="notice">家臣同士の回答が同じ意味だった場合、その回答を書いた家臣は全員失格になります。</p>'+button('start','開始する');
      else body+='<p class="notice">殿は後ろを向いて、家臣が書いているところを見ないでください。</p><div class="timer-wrap"><span class="eyebrow">残り</span><div id="timer" class="timer" role="timer" aria-label="残り秒数">'+remaining()+'<span>秒</span></div><div class="track"><div id="progress" style="width:'+(remaining()/60*100)+'%"></div></div></div><p class="lead">殿が喜びそうな答えを、紙にひとつ。</p><p class="notice">家臣同士の回答が同じ意味だった場合、その回答を書いた家臣は全員失格になります。</p><p class="small">終了音は鳴りません。画面を見てね。</p>';

    }else if(state.stage==='judge'){
      body+='<p class="eyebrow">60秒、おしまい！</p><h1>紙を殿へ渡そう。</h1><p class="lead">書き終えた紙を、殿に渡してください。</p><div class="mini-question">'+esc(questionText(state.questionId))+'</div>'+button('advance','紙がそろった →','data-from="judge"');
    }else if(state.stage==='ranking'){
      body+='<p class="eyebrow">殿だけで、順位を決めよう</p><h1>好きな順に、<br>紙を並べよう。</h1><p class="lead">まだ順位は、みんなに内緒。</p><p class="notice">家臣同士の回答が同じ意味だった場合、その回答を書いた家臣は全員失格になります。</p><p>失格の回答を除いて、順位を決めてください。</p>'+button('advance','順位が決まった →','data-from="ranking"')+'<button type="button" class="secondary" data-action="all-disqualified">全員失格・今回は小判なし</button>';
    }else if(state.stage==='reveal'){
      body+='<p class="eyebrow">殿の御沙汰・下の順位から</p><h1>最下位から順に、<br>理由も発表しよう。</h1><p class="lead">答えと、その順位にした理由をひとつずつ。</p><div class="announcement-order">最下位 → … → 2位</div><p class="notice">1位は、まだ内緒。</p><p class="small">失格の回答は順位に入れません。残った回答が1つだけなら、次へ進んでください。</p>'+button('advance','いよいよ、1位の発表へ →','data-from="reveal"');
    }else if(state.stage==='first'){
      body+='<p class="eyebrow">最後の発表です</p><h1>第1位を、<br>発表してください！</h1><p class="lead">一番気に入った答えは？</p><p>選んだ理由も、みんなに聞かせてください。</p>'+button('advance','1位を発表した →','data-from="first"');
    }else if(state.stage==='award'){
      body+='<p class="eyebrow">1位の人に、小判1枚</p><h1>小判を渡すのは誰？</h1><p class="lead">いま発表した1位の人を選んでください。</p><div class="winner-buttons">'+state.players.filter(p=>p.id!==state.round).map(p=>button('award',esc(p.name)+'<span class="reward">小判1枚</span>','data-id="'+p.id+'"')).join('')+'</div><button type="button" class="secondary" data-action="none">今回は該当者なし</button>';
    }else if(state.stage==='result'){
      const won=state.awards.find(a=>a.round===state.round).winner;
      body+='<p class="eyebrow">殿の御沙汰</p><h1>'+(won===null?'今回は、小判なし。':esc(state.players[won].name)+'に<br>小判1枚！')+'</h1>'+(won===null?'':'<div class="big-coin" aria-hidden="true">壱</div>')+scores()+button('next',state.round===state.players.length-1?'最終結果を見る →':'次の殿へ →')+(state.round<state.players.length-1?'<p class="small">次は '+esc(state.players[state.round+1].name)+' さんの番です。</p>':'');
    }else{
      const win=winners(state);
      body='<p class="eyebrow">全員が殿を務めました</p><h1>'+(win.length===0?'今回は、勝者なし。':win.length>1?'みんなに拍手！<br>共同優勝':'おめでとう！')+'</h1>'+(win.length?'<p class="champions">'+win.map(p=>esc(p.name)).join('<br>')+'</p><p class="lead">小判 '+state.scores[win[0].id]+'枚で'+(win.length>1?'共同優勝':'優勝')+'</p>':'<p class="lead">全員、小判0枚でした。</p>')+scores()+button('again','同じメンバーでもう一度')+'<button type="button" class="secondary" data-action="reset">名前を入れ直す</button>';
    }
  }
  app.innerHTML=body+(storageWarning?'<p class="error">この端末では保存できません。画面を閉じると記録が消えます。</p>':'');
  document.querySelector('#reset').hidden=!state||state.stage==='final';
  if(focus){window.scrollTo(0,0);const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
}
function change(nextState){if(nextState===state)return;state=nextState;save();render();}
app.addEventListener('input',e=>{if(e.target.dataset.name!==undefined)names[Number(e.target.dataset.name)]=e.target.value;});
app.addEventListener('submit',e=>{e.preventDefault();try{state=newGame(names);error='';save();render();}catch(err){error=err.message;render(false);}});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action;
 if(a==='more'&&!state&&names.length<6){names.push('');render(false);}
 if(a==='less'&&!state&&names.length>4){names.pop();render(false);}
 if(a==='reset'){names=['','','',''];state=null;save();render();}
 if(!state)return;
 if(a==='choose')change(choose(state,Number(b.dataset.id)));
 if(a==='start')change(start(state));
 if(a==='advance')change(advanceAnnouncement(state,b.dataset.from));
 if(a==='all-disqualified')change(noEligibleAnswers(state));
 if(a==='award')change(award(state,Number(b.dataset.id)));
 if(a==='none')change(award(state,null));
 if(a==='next')change(next(state));
 if(a==='again'&&state.stage==='final')change(newGame(state.players.map(p=>p.name)));
});
document.querySelector('#reset').addEventListener('click',()=>{if(confirm('今のゲームを終了して、名前の入力に戻りますか？')){names=state.players.map(p=>p.name);state=null;save();render();}});
function refreshTimer(){
 if(state?.stage!=='writing')return;
 const updated=tick(state);
 if(updated!==state){change(updated);document.querySelector('#announce').textContent='60秒が終わりました。紙を殿へ渡してください。';return;}
 const time=remaining(), timer=document.querySelector('#timer');
 if(timer){timer.innerHTML=time+'<span>秒</span>';timer.classList.toggle('urgent',time<=10);document.querySelector('#progress').style.width=(time/60*100)+'%';}
}
setInterval(refreshTimer,200);
document.addEventListener('visibilitychange',refreshTimer);
window.addEventListener('pageshow',refreshTimer);
render(false);
}

</script></body></html>
