<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5e5">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="三宅組の仲間12人だけの、ありがとうシャワー。">
<title>三宅組のみんな、ありがとう😊｜三宅組専用</title>
<style>
:root{color-scheme:light;--ink:#3c3541;--muted:#756a70;--pink:#e44e76;--dark:#a52f58;--yellow:#ffc943;--cream:#fff7e9;--border:#f6d8d8}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 12% 10%,#ffe0e5 0%,transparent 38%),radial-gradient(ellipse at 94% 23%,#fff0be 0%,transparent 39%),linear-gradient(180deg,#fff6ee,#fffdf9);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.55}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #825ac7;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.48}
[hidden]{display:none!important}
.wrap{width:min(660px,calc(100% - 28px));margin:0 auto}
.top{padding:21px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;letter-spacing:.08em}
.logo-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:#fff;color:var(--pink);box-shadow:0 3px 10px #d3868624;font-size:21px}
.tag{font-size:11px;font-weight:800;border:1px solid #efcbd1;background:#fff9fb;color:#ae5e70;border-radius:999px;padding:6px 10px}
.hero{text-align:center;padding:21px 0 19px}
.hearts{font-size:32px;letter-spacing:8px;filter:drop-shadow(0 4px 3px #e99b9b44)}
.hero h1{font-size:clamp(26px,7vw,40px);letter-spacing:-.035em;line-height:1.42;font-weight:900;margin:12px auto;color:#b63560}
.hero h1 span{color:#e95573}
.hero p{margin:8px auto 0;max-width:520px;font-size:14px;color:#75666d}
.card{background:#fff;border:1px solid #f4d9d9;border-radius:24px;padding:clamp(18px,5vw,30px);box-shadow:0 18px 42px rgba(150,91,108,.10)}
.card h2{margin:0 0 7px;font-size:23px;color:#4d3944}
.card p{margin:0 0 16px;color:#7b6c76;font-size:13px}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.name{min-height:54px;padding:10px 5px;text-align:center;border-radius:14px;border:2px solid #f4e0e4;background:#fffbfc;color:#55434e;font-size:clamp(12px,3.45vw,15px);font-weight:800;transition:background .15s,transform .15s}
.name:active{transform:scale(.97)}
.name[aria-pressed="true"]{background:#ffecf1;color:#b9235c;border-color:#e64e7b;box-shadow:0 0 0 2px #ffcfdd inset}
.start{border:0;background:linear-gradient(110deg,#f26382,#d63869);color:#fff;min-height:62px;border-radius:16px;width:100%;font-weight:900;font-size:17px;box-shadow:0 6px 0 #ad2c55}
.start:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #ad2c55}
.choice-info{text-align:center;min-height:23px;font-size:13px!important;color:#aa5375!important;margin:0 0 10px!important;font-weight:800}
.note{font-size:11px!important;text-align:center;color:#98848b!important;margin:17px auto 0!important}
.foot{text-align:center;padding:22px 12px 38px;font-size:11px;color:#98858b}
.foot b{color:#a45968}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;min-height:100dvh;background:radial-gradient(ellipse at 10% 0%,#ffe0ed,transparent 45%),radial-gradient(ellipse at 90% 65%,#fff0b9,transparent 47%),#fff9ef;overflow:hidden}
.screen-head{position:relative;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(13px + env(safe-area-inset-top)) 16px 12px}
.s-badge{background:#fff9ff;border:1px solid #efc2d4;border-radius:100px;padding:8px 12px;font-size:12px;font-weight:900;color:#b64c72;box-shadow:0 5px 14px #be788a16}
.counter{font-size:12px;font-weight:800;color:#a06576}
.shower-stage{position:relative;flex:1;display:flex;justify-content:center;align-items:center;min-height:0;isolation:isolate}
.orb{position:absolute;inset:12% 11%;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff7f5 35%,#fff1ee11 70%);filter:blur(2px);pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;left:var(--x);top:var(--y);max-width:min(43vw,205px);min-width:88px;opacity:0;background:#fff;border:1px solid #f9d5d9;box-shadow:0 10px 23px #c9879531;border-radius:17px;padding:10px 13px;text-align:center;font-size:clamp(11px,3.5vw,16px);font-weight:800;color:#b33767;line-height:1.5;transform:translate(-50%,-50%) scale(.7) rotate(var(--tilt));animation:fly var(--dur) ease-in-out forwards;overflow-wrap:anywhere}
.bubble.sun{background:#fff4c8;color:#ad6b21;border-color:#fae6a6}
.bubble.mint{background:#e9fbf3;color:#3e8470;border-color:#cbf1e0}
.bubble.lav{background:#f2ebff;color:#7856a8;border-color:#e5d3fa}
.bubble.big{font-size:clamp(14px,4vw,20px);border-width:2px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.65) rotate(var(--tilt))}14%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-85%) scale(1.04) rotate(var(--tilt))}}
.quote{z-index:3;position:relative;max-width:min(80vw,480px);width:100%;pointer-events:none;text-align:center;padding:25px 8px;border-radius:26px;background:#fffdf9d4;backdrop-filter:blur(5px);box-shadow:0 10px 26px #eab8b821}
.quote .small{font-size:12px;color:#a55c76;font-weight:800}
.quote .heart{font-size:40px;color:#ef547c;margin:3px 0 5px;filter:drop-shadow(0 6px 4px #f6b5c0)}
.quote h2{font-size:clamp(23px,7.1vw,38px);color:#b83765;margin:0;line-height:1.6;overflow-wrap:anywhere}
.quote p{font-size:clamp(12px,3.5vw,15px);color:#817079;margin:13px 0 0}
.pop{animation:pop .54s ease both}
@keyframes pop{0%{opacity:.1;transform:scale(.91)}70%{opacity:1;transform:scale(1.025)}100%{transform:scale(1)}}
.controls{position:relative;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:9px 12px calc(15px + env(safe-area-inset-bottom));background:#ffffffd9;border-top:1px solid #f4dadd;backdrop-filter:blur(8px)}
.control{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 2px;min-height:56px;border:1px solid #f0d4dc;background:#fff;border-radius:12px;font-size:12px;color:#6e5460;font-weight:800}
.control .emoji{font-size:21px;line-height:1}
.control.sound-on{background:#fff0f4;border-color:#e75883;color:#b43161}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);border-radius:14px;padding:11px 16px;text-align:center;background:#463b48;color:#fff;font-size:13px;font-weight:700;box-shadow:0 10px 30px #503c4c44}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:420px){.hero{padding-top:14px}.names{grid-template-columns:repeat(2,minmax(0,1fr))}.name{font-size:15px}.card h2{font-size:20px}.quote{max-width:79vw}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}.bubble{opacity:1;animation:none}}
</style>
</head>
<body>
<div id="entry">
  <header class="top wrap"><div class="logo"><span class="logo-icon">♥</span> 三宅組の感謝部屋</div><span class="tag">仲間限定の名前選択</span></header>
  <main class="wrap">
    <section class="hero">
      <div class="hearts" aria-hidden="true">💗 😊 💛</div>
      <h1>三宅組のみんな、<br><span>ありがとう😊</span></h1>
      <p>いつも一緒に笑ってくれる仲間へ。<br>名前を選ぶだけで、感謝と褒め言葉が止まらない！</p>
    </section>
    <section class="card">
      <h2>誰に「ありがとう」を届ける？</h2>
      <p>三宅組の12人から選んでください。名前は自由入力できません。</p>
      <div id="memberGrid" class="names" role="group" aria-label="三宅組のメンバーを選択"></div>
      <p id="choiceInfo" class="choice-info" aria-live="polite">名前をひとつ選んでね 😊</p>
      <button id="start" class="start" type="button" disabled>💗 ありがとうを浴びる！</button>
      <p class="note">ログイン不要・無料。表示名は送信も保存もしません。<br>専用リンクは、三宅組の仲間だけで共有してね。</p>
    </section>
  </main>
  <footer class="foot"><b>三宅組のみんな、ありがとう😊</b><br>笑いと感謝が絶えない場所に。</footer>
</div>
<div id="shower" class="screen" hidden>
  <div class="screen-head"><span class="s-badge">💗 三宅組のみんな、ありがとう😊</span><span id="count" class="counter">ありがとう 0 回</span></div>
  <div class="shower-stage">
    <div class="orb" aria-hidden="true"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="quote" id="quote">
      <div id="recipient" class="small">三宅組の仲間へ</div>
      <div class="heart" aria-hidden="true">♥</div>
      <h2 id="mainQuote">ありがとう！</h2>
      <p id="subQuote">今日もここにいてくれてありがとう。</p>
    </div>
    <div id="announce" class="sr" aria-live="polite" aria-atomic="true"></div>
  </div>
  <nav class="controls" aria-label="シャワーの操作">
    <button class="control" id="pause" type="button"><span class="emoji">⏸</span><span id="pauseText">一時停止</span></button>
    <button class="control" id="sound" type="button" aria-label="音を切り替える"><span class="emoji">♪</span><span id="soundText">音：オフ</span></button>
    <button class="control" id="share" type="button"><span class="emoji">💌</span><span>友達に贈る</span></button>
    <button class="control" id="back" type="button"><span class="emoji">↩</span><span>名前を選ぶ</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="text-align:center;padding:20px;background:#fff3ce">JavaScriptを有効にしてSafariなどのブラウザで開いてください。</p></noscript>
<script>
(() => {
"use strict";
const MEMBERS = ["三宅ちゃん","吾郎ちゃん","秋山くん","高雅","遠ちゃん","石井ちゃん","ひろしくん","小泉くん","秀忠っちゃん","ごっちゃごちゃ","庄司くん","孔明"];
const $ = id => document.getElementById(id);
const el = {
  entry:$("entry"),shower:$("shower"),grid:$("memberGrid"),info:$("choiceInfo"),
  start:$("start"),count:$("count"),confetti:$("confetti"),
  quote:$("quote"),main:$("mainQuote"),sub:$("subQuote"),recipient:$("recipient"),
  announce:$("announce"),pause:$("pause"),pauseText:$("pauseText"),
  sound:$("sound"),soundText:$("soundText"),share:$("share"),
  back:$("back"),toast:$("toast")
};
let selected = "",active = false,paused = false,hiddenPause = false;
let count = 0, mainTimer = 0, bubbleTimer = 0, soundMode = 0, audioContext = null;
let recent = [], toastTimer = 0;
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const pick = list => list[Math.floor(Math.random() * list.length)];
const other = () => pick(MEMBERS.filter(name => name !== selected));
const templates = [
  n => n+"、今日もいてくれてありがとう！",
  n => n+"の笑顔が、三宅組の宝物です！",
  n => n+"、今日もほんとにお疲れさま！",
  n => "三宅組に"+n+"がいて、よかった！",
  n => n+"のおかげで、今日もちょっといい日！",
  n => n+"、あなたの優しさに拍手！",
  n => "三宅組の"+n+"に、感謝の嵐！",
  n => n+"、その存在だけで花まる！",
  n => n+"、楽しい時間をありがとう😊",
  n => "よっ、"+n+"！ ありがとうの大将！",
  n => n+"のいいところ、数えきれません！",
  n => "今日は"+n+"を全力で褒める日！",
  n => "感謝の表彰状、"+n+"に贈呈！",
  n => "「ありがとう」って何度でも言いたい。"+n+"へ！",
  n => n+"、何もしない日だって素敵だよ！",
  n => n+"、自分にもありがとうを言ってあげて！",
  n => "ありがとう速報！ "+n+"に拍手が止まらない！",
  n => "感謝が多すぎて、"+n+"の周辺で渋滞中！",
  n => n+"、おかわりのありがとう、どうぞ！",
  n => "本日の主役は"+n+"！ 異論は受け付けません！",
  n => n+"、三宅組の笑顔担当、勝手に任命！",
  n => n+"の今日に、特大の花まる！",
  n => n+"、次の集まりも楽しみだね！",
  n => n+"のこと、みんなで褒めちぎろう！",
  n => "三宅組から"+n+"へ、ありがとうの大合唱！",
  n => n+"、遠慮せず褒められてください！",
  n => n+"、集合しただけで今日は優勝！",
  n => n+"がいれば話題が尽きない……かも！",
  n => n+"、笑いじわは幸せの勲章！",
  n => "三宅組の全員へ。そして"+n+"へ、ありがとう！",
  n => n+"と"+other()+"、またみんなで笑おうね！",
  n => other()+"にも聞かせたい！ "+n+"、最高！",
  n => "三宅組、"+n+"への感謝を緊急増量中！",
  n => "楽しい仲間がいる幸せ。"+n+"、ありがとう！",
  n => n+"、今日はいいことが起こりそう！",
  n => "拍手！ 拍手！ "+n+"、大拍手！"
];
const akiyamaTemplates = [
  n => n+"、『わかりません』は名台詞。でも、みんなが大好きなのはわかってます！",
  n => n+"、明日のことは『わかりません』。今日の感謝は、はっきり伝えます！",
  n => n+"、『わかりません』のひと言で、場がふっと和む。いつもありがとう！",
  n => n+"、麻雀好きのあなたと囲む時間は、三宅組の宝物！",
  n => n+"、役満よりうれしいのは、みんなで笑えるひとときだね！",
  n => n+"、今日の三宅組は『ありがとう』の役満です！",
  n => n+"、スロット好きのあなたへ。今日は感謝の７・７・７を贈ります！",
  n => n+"、リールが何で止まっても、仲間からの『ありがとう』は止まりません！",
  n => n+"、実家のお豆腐屋さんの話も、あなたとの大切な思い出のひとつ！",
  n => n+"、実家はお豆腐屋さん。三宅組では、笑顔をつなぐ大切な仲間！",
  n => n+"、豆腐のようにやさしい味わいのその存在に、ほっとするよ！",
  n => n+"、麻雀もスロットも好き。みんなは、そんなあなたと遊ぶ時間が大好き！"
];
const mini = [
  "ありがとう！","今日も最高！","いい笑顔！","大感謝！",
  "花まる！","ナイス！","感謝の嵐！","ありがとう😊","お疲れさま！",
  "三宅組、最高！","笑顔に乾杯！","よっ、大将！","大好きな仲間！",
  "ほんとに感謝！","また集まろう！"
];
const subs = [
  "何度でも言わせてください。ありがとう！",
  "友達と笑える日は、きっといい日。",
  "一緒に過ごす時間って、宝物だね。",
  "三宅組から、拍手を送ります！",
  "今日も、自分にやさしくね。",
  "まだまだ感謝のシャワーは続きます！",
  "うれしい言葉は遠慮せず受け取ってね。",
  "こんな仲間がいることに、ありがとう😊"
];
function toast(msg) {
  el.toast.textContent = msg; el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {el.toast.hidden = true;}, 3000);
}
function choose(name) {
  if (!MEMBERS.includes(name)) return;
  selected = name;
  for (const btn of el.grid.querySelectorAll("button")) {
    btn.setAttribute("aria-pressed", String(btn.dataset.name === name));
  }
  el.info.textContent = name + "に、ありがとうを届けます😊";
  el.start.disabled = false;
}
function makeButtons() {
  MEMBERS.forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "name"; b.textContent = name;
    b.dataset.name = name; b.setAttribute("aria-pressed","false");
    b.addEventListener("click", () => choose(name));
    el.grid.appendChild(b);
  });
}
function newPhrase() {
  const pool = selected === "秋山くん" ? templates.concat(akiyamaTemplates) : templates;
  let text = "", attempts = 0;
  do { text = pick(pool)(selected); attempts += 1; }
  while (recent.includes(text) && attempts < 12);
  recent.push(text);
  if (recent.length > 13) recent.shift();
  return text;
}
function stopTimers() {
  clearInterval(mainTimer);clearInterval(bubbleTimer);
  mainTimer=0;bubbleTimer=0;
}
function cancelSpeech() {if ("speechSynthesis" in window) window.speechSynthesis.cancel();}
function playSound(preview) {
  if(!active||paused||hiddenPause||soundMode!==1||!audioContext||audioContext.state!=="running")return;
  try {
    const notes=preview?[[659.25,0],[830.61,.18],[987.77,.36]]:[[783.99,0],[987.77,.14]];
    const at=audioContext.currentTime+.012;
    for (const pair of notes) {
      const osc=audioContext.createOscillator(),gain=audioContext.createGain();
      const start=at+pair[1];
      osc.type="sine";osc.frequency.setValueAtTime(pair[0],start);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(preview?.14:.065,start+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.35);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(start);osc.stop(start+.37);
    }
  } catch(_){toast("音が再生できません。端末の音量も確認してね。");}
}
async function unlockSound(){
  try {
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx){toast("このブラウザは効果音に対応していません。");return;}
    if(!audioContext)audioContext=new Ctx();
    if(audioContext.state!=="running")await audioContext.resume();
    if(soundMode===1&&active&&audioContext.state==="running"){
      playSound(true);toast("効果音ON ♪");
    } else if(audioContext.state!=="running") toast("音声の再生がブロックされました。");
  }catch(_){toast("Safariで開き、音量を確認してください。");}
}
function speak(text) {
  if(soundMode!==2||paused||hiddenPause||!("speechSynthesis" in window))return;
  try{
    cancelSpeech();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";u.rate=.96;u.pitch=1.05;u.volume=1;
    const voices=window.speechSynthesis.getVoices();
    const voice=voices.find(v=>v.lang.toLowerCase().startsWith("ja"));
    if(voice)u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(_){toast("読み上げに対応していないブラウザです。");}
}
function bubble(){
  if(!active||paused||hiddenPause)return;
  const mobile=window.innerWidth<560;
  const slots=mobile?
    [[23,16],[76,16],[22,32],[78,33],[20,72],[79,71],[21,88],[79,87]]:
    [[12,17],[87,17],[13,35],[87,35],[13,70],[87,70],[23,87],[77,87]];
  if(el.confetti.children.length>=6)el.confetti.firstElementChild.remove();
  const used=new Set([...el.confetti.children].map(node=>Number(node.dataset.slot)));
  const free=slots.map((_,i)=>i).filter(i=>!used.has(i));
  const slot=pick(free.length?free:slots.map((_,i)=>i));
  const b=document.createElement("div");
  b.className="bubble "+pick(["sun","mint","lav",""]);
  if(Math.random()<.16)b.classList.add("big");
  b.textContent=pick(mini);
  b.dataset.slot=slot;
  b.style.setProperty("--x",slots[slot][0]+"%");
  b.style.setProperty("--y",slots[slot][1]+"%");
  b.style.setProperty("--tilt",Math.floor(Math.random()*9-4)+"deg");
  const dur=reduce?5000:4300+Math.floor(Math.random()*700);
  b.style.setProperty("--dur",dur+"ms");
  el.confetti.appendChild(b);
  setTimeout(()=>b.remove(),dur+150);
  count++;el.count.textContent="ありがとう "+count+" 回";
  if(soundMode===1)playSound(false);
}
function mainPhrase(){
  if(!active||paused||hiddenPause)return;
  const t=newPhrase();
  el.main.textContent=t;
  el.sub.textContent=pick(subs);
  el.quote.classList.remove("pop");
  void el.quote.offsetWidth;el.quote.classList.add("pop");
  el.announce.textContent=t;
  if(soundMode===2)speak(t);
}
function timers(){
  stopTimers();
  if(!active||paused||hiddenPause)return;
  mainTimer=setInterval(mainPhrase,3800);
  bubbleTimer=setInterval(bubble,reduce?2300:1420);
}
function start(){
  if(!MEMBERS.includes(selected))return;
  count=0;recent=[];active=true;paused=false;hiddenPause=false;soundMode=0;
  el.count.textContent="ありがとう 0 回";
  el.recipient.textContent=selected+"へ、三宅組から";
  el.confetti.replaceChildren();
  el.entry.hidden=true;el.shower.hidden=false;
  document.body.style.overflow="hidden";
  el.pauseText.textContent="一時停止";el.pause.firstElementChild.textContent="⏸";
  updateAudioUI();mainPhrase();bubble();
  timers();
}
function goBack(){
  stopTimers();cancelSpeech();active=false;paused=false;hiddenPause=false;soundMode=0;
  el.entry.hidden=false;el.shower.hidden=true;el.confetti.replaceChildren();
  document.body.style.overflow="";
  el.start.focus({preventScroll:true});
}
function updateAudioUI(){
  const states=["音：オフ","効果音ON","読み上げON"];
  el.soundText.textContent=states[soundMode];
  el.sound.classList.toggle("sound-on",soundMode!==0);
  el.sound.setAttribute("aria-label",states[soundMode]+"。押すと切り替えます。");
  el.sound.setAttribute("aria-pressed",String(soundMode!==0));
}
function toggleAudio(){
  const supported="speechSynthesis" in window;
  if(soundMode===2)cancelSpeech();
  soundMode=(soundMode+1)%(supported?3:2);
  updateAudioUI();
  if(soundMode===1)void unlockSound();
  else if(soundMode===2){speak(el.main.textContent);toast("読み上げON。音量を確認してね。");}
  else toast("音をオフにしました。");
}
async function share(){
  if(!MEMBERS.includes(selected))return;
  const url=new URL(location.href);
  url.search="";url.hash=new URLSearchParams({to:selected}).toString();
  const title="三宅組のみんな、ありがとう😊";
  const text=selected+"へ、三宅組からありがとうを贈ります😊";
  if(navigator.share){try{await navigator.share({title,text,url:url.href});return;}catch(e){if(e.name==="AbortError")return;}}
  try{
    await navigator.clipboard.writeText(text+"\n"+url.href);
    toast("リンクをコピー！LINEに貼り付けてね😊");
  }catch(_){window.prompt("このリンクをコピーしてLINEで送ってね",url.href);}
}
el.start.addEventListener("click",start);
el.pause.addEventListener("click",()=>{
  paused=!paused;
  el.pauseText.textContent=paused?"再開":"一時停止";
  el.pause.firstElementChild.textContent=paused?"▶️":"⏸";
  if(paused){stopTimers();cancelSpeech();}
  else{mainPhrase();timers();}
});
el.sound.addEventListener("click",toggleAudio);
el.share.addEventListener("click",share);
el.back.addEventListener("click",goBack);
document.addEventListener("visibilitychange",()=>{
  if(!active)return;
  if(document.hidden){hiddenPause=true;stopTimers();cancelSpeech();}
  else{hiddenPause=false;timers();}
});
window.addEventListener("pagehide",()=>{stopTimers();cancelSpeech();});
makeButtons();
const to=new URLSearchParams(location.hash.slice(1)).get("to");
if(to&&MEMBERS.includes(to))choose(to);
})();
</script>
</body>
</html>
